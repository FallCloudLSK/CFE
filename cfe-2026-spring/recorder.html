}

/* ---------- 對話框 ---------- */
function modal({ title, sub, body, buttons, wide }) {
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'mw';
    const d = document.createElement('div'); d.className = 'md' + (wide ? ' wide' : '');
    d.innerHTML = '<div class="hd">' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><div class="bd"></div><div class="ft"></div>';
    if (typeof body === 'string') d.querySelector('.bd').innerHTML = body; else if (body) d.querySelector('.bd').appendChild(body);
    const close = v => { w.remove(); res(v); };
    (buttons || []).forEach(b => { const bt = document.createElement('button'); bt.className = 'btn sm ' + (b.cls || ''); bt.textContent = b.label; bt.onclick = () => close(typeof b.v === 'function' ? b.v() : b.v); d.querySelector('.ft').appendChild(bt); });
    w.appendChild(d); w.onclick = e => { if (e.target === w) close(null); };
    d._close = close;
    $('modalRoot').appendChild(w);
  });
}
function pickOption({ title, sub, options, row, skip }) {
  const body = document.createElement('div');
  body.className = row ? 'optrow' : 'opts';
  let closer;
  options.forEach(o => { const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = esc(o.label) + (o.sub ? '<small>' + esc(o.sub) + '</small>' : ''); b.onclick = () => closer(o.v); body.appendChild(b); });
  const btns = [{ v: null, label: '取消', cls: 'ghost' }];
  if (skip) btns.push({ v: 0, label: skip, cls: 'soft' });
  const p = modal({ title, sub, body, buttons: btns });
  closer = v => { body.closest('.md')._close(v); };
  return p;
}
function pickCards({ title, sub, n, min, skip }) {
  // 回傳：陣列（可能為空＝略過），或 null（取消）
  const chosen = [];
  const body = document.createElement('div');
  const g = document.createElement('div'); g.className = 'grid'; g.style.justifyContent = 'center';
  const tray = document.createElement('div'); tray.className = 'tray'; tray.style.maxWidth = 'none';
  body.appendChild(g); body.appendChild(tray);
  let closer;
  const draw = () => {
    g.innerHTML = gridHTML(counts(chosen));
    g.querySelectorAll('.cd').forEach(b => b.onclick = () => {
      if (chosen.length >= n) { if (n === 1) chosen.length = 0; else return toast('最多 ' + n + ' 張'); }
      chosen.push(b.dataset.c); draw();
      if (n === 1 && !min) closer(chosen.slice());
    });
    tray.innerHTML = chosen.length ? chosen.map((k, i) => '<span class="tc e' + card(k).e + 'c" data-i="' + i + '">' + k + ' ✕</span>').join('') : '<span class="hint">' + (n === 1 ? '點選一張牌' : '點選最多 ' + n + ' 張牌') + '</span>';
    tray.querySelectorAll('.tc').forEach(x => x.onclick = () => { chosen.splice(+x.dataset.i, 1); draw(); });
  };
  draw();
  const btns = [{ v: null, label: '取消', cls: 'ghost' }];
  if (skip) btns.push({ v: () => [], label: typeof skip === 'string' ? skip : '略過', cls: 'soft' });
  if (n > 1 || min) btns.push({ v: () => (chosen.length >= (min || 1) ? chosen.slice() : (toast('請選牌'), undefined)), label: '確定', cls: '' });
  const p = modal({ title, sub, body, buttons: btns, wide: true }).then(v => (v === undefined ? pickCards({ title, sub, n, min, skip }) : v));
  closer = v => body.closest('.md')._close(v);
  return p;
}
function confirm2(title, msg) { return modal({ title, body: '<div style="font-size:16px">' + esc(msg) + '</div>', buttons: [{ v: false, label: '取消', cls: 'ghost' }, { v: true, label: '確定', cls: '' }] }); }
function prompt2(title, ph) {
  const body = document.createElement('div');
  body.innerHTML = '<input style="width:100%;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:12px" placeholder="' + esc(ph) + '">';
  setTimeout(() => body.querySelector('input').focus(), 50);
  return modal({ title, body, buttons: [{ v: null, label: '取消', cls: 'ghost' }, { v: () => body.querySelector('input').value.trim(), label: '確定', cls: '' }] });
}

$('bUndo').onclick = () => { if (!hist.length) return; fut.push(JSON.stringify(SES)); SES = JSON.parse(hist.pop()); save(); render(); };
$('bRedo').onclick = () => { if (!fut.length) return; hist.push(JSON.stringify(SES)); SES = JSON.parse(fut.pop()); save(); render(); };

  const last = cur(); const o = ENGINE.replay(last).final.over;

  const f = await pickOption({ title: '第' + (SES.games.length + 1) + '局：誰先攻？', row: true, options: [0, 1].map(w => ({ v: String(w), label: SES.players[w] })) });
  if (f == null) return;
  snap();
  SES.games.push(ENGINE.newMatch(SES.players, +f, { mods: SES.mods, hp: SES.hp }));
  SES.cur = SES.games.length - 1; editTurn = null; sel = [];
  commit();
};
$('bReset').onclick = async () => {
  const ok = await confirm2('清除所有資料？', '會刪除這組對手的所有對局記錄（建議先備份或匯出）。');
  if (!ok) return;
  SES = null; hist = []; fut = []; editTurn = null; sel = [];
  localStorage.removeItem(KEY); render();
};
function fname(ext) {
  const d = new Date(); const ds = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  return '戰局記錄_' + SES.players[0] + '_vs_' + SES.players[1] + '_' + ds + '.' + ext;
}
function download(data, name, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('bHtml').onclick = () => download(REPORT.exportHTML(SES), fname('html'), 'text/html;charset=utf-8');
$('bXlsx').onclick = () => download(new Blob([REPORT.exportXLSX(SES)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fname('xlsx'));
$('bBackup').onclick = () => download(JSON.stringify(SES, null, 1), fname('json'), 'application/json');
$('bRestore').onclick = $('bRestore2').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      let t = rd.result;
      if (/<html/i.test(t)) { const mm = t.match(/<script type="application\/json" id="cfe-recorder-data">([\s\S]*?)<\/script>/); if (!mm) throw new Error('此網頁沒有記錄資料'); t = mm[1]; }
      const d = JSON.parse(t);
      if (!d.games || !d.players) throw new Error('格式不符');
      if (SES) snap();
      SES = d; SES.cur = Math.min(SES.cur || 0, SES.games.length - 1); editTurn = null; sel = [];
      commit(); toast('已還原');
    } catch (err) { toast('還原失敗：' + err.message); }
  };
  rd.readAsText(f); e.target.value = '';
};

load();
render();
