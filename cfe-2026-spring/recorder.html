body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;margin:0;padding:10px;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
.container{max-width:1400px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(31,79,138,.10);overflow:hidden}
header{background:linear-gradient(135deg,#2f6db5 0%,#4c9bd8 55%,#7cc6ea 100%);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
.brand img{width:48px;height:48px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.7)}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:1px}
.brand .sub{font-size:14px;opacity:.92}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtn{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.45);padding:7px 13px;border-radius:9999px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:disabled{opacity:.4;cursor:default}
.tsel{background:rgba(255,255,255,.95);color:var(--pri-deep);border:none;padding:7px 10px;border-radius:9999px;font-size:15px;font-weight:700}
footer{text-align:center;color:#8aa0b6;font-size:12px;padding:8px 0 12px}

/* ---- setup ---- */
.setup{padding:24px;max-width:860px;margin:0 auto}
.setup h2{color:var(--pri-deep);margin:0 0 16px}
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
.pbox{border:2px solid var(--line);border-radius:16px;padding:14px}
.pbox.L{border-color:#b9d5f1;background:var(--L-soft)} .pbox.R{border-color:#f0d0b4;background:var(--R-soft)}
.pbox label{font-size:14px;color:var(--sub);font-weight:700}
.pbox input{width:100%;font-size:22px;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-top:4px;background:#fff}
.pbox .first{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;cursor:pointer}
.pbox .first input{width:22px;height:22px;margin:0}
.vs-row .vs{font-size:28px;font-weight:900;color:#9fb3c8;padding-bottom:30px}
.mods{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.mods label{border:2px solid var(--line);border-radius:9999px;padding:6px 14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.mods label.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-deep)}
.mods input{display:none}
.btn{border:none;padding:12px 22px;border-radius:9999px;font-weight:700;font-size:17px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(47,116,192,.25)}
.btn.soft{background:var(--pri-soft);color:var(--pri-deep);box-shadow:none}
.btn.ghost{background:#fff;color:var(--pri-deep);border:2px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#e2b33b,#cf8f17);box-shadow:0 3px 10px rgba(207,143,23,.3)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:8px 14px;font-size:15px}
.btn:disabled{background:#c9d4df;color:#fff;box-shadow:none;cursor:default}

/* ---- board ---- */
.board{display:grid;grid-template-columns:1fr 210px 1fr;gap:10px;padding:10px 12px;background:#f4f9fd;border-bottom:1px solid var(--line)}
.pc{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;position:relative;transition:box-shadow .2s,border-color .2s;min-height:150px}
.pc.L{border-left:8px solid var(--L)} .pc.R{border-right:8px solid var(--R)}
.pc.turn{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,160,23,.28),0 6px 18px rgba(212,160,23,.25)}
.pc.turn::after{content:'本回合';position:absolute;top:-12px;background:var(--gold);color:#fff;font-size:13px;font-weight:900;padding:1px 10px;border-radius:9999px}
.pc.L.turn::after{left:14px} .pc.R.turn::after{right:14px}
.pc .top{display:flex;align-items:baseline;gap:10px}
.pc.R .top{flex-direction:row-reverse}
.pc .nm{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.L .nm{color:var(--L)} .pc.R .nm{color:var(--R)}
.pc .hp{font-size:38px;font-weight:900;line-height:1;margin-left:auto}
.pc.R .hp{margin-left:0;margin-right:auto}
.pc .hp small{font-size:15px;color:var(--sub);font-weight:700}
.bar{height:9px;background:#eef2f6;border-radius:9999px;overflow:hidden;margin:5px 0 7px}
.bar i{display:block;height:100%;border-radius:9999px;background:linear-gradient(90deg,#4fc08d,#2e9d6a)}
.pc.R .bar i{margin-left:auto}
.bar i.mid{background:linear-gradient(90deg,#f0c34a,#d9a21a)} .bar i.low{background:linear-gradient(90deg,#ef7d8d,#d0576b)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pc.R .chips{justify-content:flex-end}
.ch{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:2px 10px;font-size:14px;font-weight:700;background:#f1f5f9;color:#3c4f63;white-space:nowrap}
.ch.k{background:var(--pri-soft);color:var(--pri-deep)}
.ch.sh{background:#e7f6ff;color:#1677a8}
.ch.st{background:#fff0d6;color:#9a6200}
.ch.bad{background:var(--bad-bg);color:#b03548}
.ch.e0{background:var(--e0s);color:#5d6670}.ch.e1{background:var(--e1s);color:#2a7f37}.ch.e2{background:var(--e2s);color:#1d64a8}.ch.e3{background:var(--e3s);color:#b23a1c}.ch.e4{background:var(--e4s);color:#8a6d00}
.ch .lab{color:var(--sub);font-weight:500;font-size:12px}
.pips{display:inline-flex;gap:2px}.pips b{width:9px;height:9px;border-radius:50%;background:#dfe6ee;display:inline-block}.pips b.on{background:currentColor}
.mini-back{width:16px;height:24px;border-radius:3px;vertical-align:middle;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.stars5{display:inline-flex;gap:2px;margin-left:2px}.stars5 b{width:8px;height:8px;border-radius:2px;background:#e3e9ef}.stars5 b.on{background:var(--gold)}
.hand{font-size:15px;font-weight:700;color:var(--ink)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.center .tn{font-size:15px;color:var(--sub);font-weight:700}
.center .tn b{font-size:36px;color:var(--pri-deep);display:block;line-height:1}
.center .env{font-size:15px;font-weight:800;padding:3px 14px;border-radius:9999px;background:#f1f5f9;color:var(--sub)}
.center .who{font-size:15px;font-weight:800}
.center .over{background:linear-gradient(135deg,#e7b93d,#c98a10);color:#fff;padding:5px 12px;border-radius:12px;font-weight:900;font-size:15px}

/* ---- edit bar ---- */
.editbar{background:#fff7dc;border-bottom:2px solid #f0d27a;padding:8px 16px;display:flex;align-items:center;gap:12px;font-weight:800;color:#7a5600}
.editbar .btn{margin-left:auto}

/* ---- timeline ---- */
.badlist{margin:4px 0}.badlist summary{cursor:pointer;color:var(--sub);font-size:14px;padding:4px 2px}.badlist .cb{margin-top:6px}
.tl{max-height:30vh;overflow:auto;border-bottom:1px solid var(--line)}
.tl table{border-collapse:separate;border-spacing:0;width:100%}
.tl th{white-space:nowrap;position:sticky;top:0;z-index:1;background:#f1f7fc;color:var(--pri-deep);font-size:14px;padding:6px;border-bottom:1px solid var(--line)}
.tl td{padding:5px 8px;border-bottom:1px solid #e8eff6;font-size:15px;vertical-align:top}
.tl tr{cursor:pointer}
.tl tr:hover td{background:#f6fbff}
.tl td.n{font-weight:900;color:var(--sub);text-align:center;width:46px}
.tl td.who{font-weight:800;white-space:nowrap;width:1%}
.tl tr.p0 td.who{color:var(--L)} .tl tr.p1 td.who{color:var(--R)}
.tl tr.p0 td:first-child{box-shadow:inset 5px 0 0 var(--L)} .tl tr.p1 td:first-child{box-shadow:inset 5px 0 0 var(--R)}
.tl td.hp{text-align:center;font-weight:900;width:56px}
.tl td.c{text-align:center;width:1%;white-space:nowrap}
.tl .act{font-weight:700}
.tl .nt{color:var(--sub);font-size:13px}
.tl .pre{color:#5b4ba0;font-size:14px}
.tl tr.error td{background:var(--bad-bg)!important}
.tl tr.warn td{background:var(--warn-bg)!important}
.tl tr.live td{background:#fffdf3}
.tl tr.editing td{outline:2px solid var(--gold);outline-offset:-2px}
.tl .iss{color:#b03548;font-size:13px;font-weight:700}
.tl .iss.w{color:#9a6a00}

/* ---- ops ---- */
.ops{display:grid;grid-template-columns:270px auto 1fr;gap:12px;padding:12px}
.col h3{margin:0 0 6px;font-size:15px;color:var(--pri-deep);display:flex;align-items:center;gap:8px}
.col h3 .who{font-size:13px;padding:1px 10px;border-radius:9999px;color:#fff}
.prebtns{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pb{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:16px;font-weight:800;cursor:pointer;text-align:left;color:var(--ink)}
.pb small{font-weight:500;color:var(--sub);font-size:12px;margin-left:auto;text-align:right}
.pb.pouch{border-color:#c9b8f0;background:#f6f2ff}
.pb.ab{border-color:#b9d5f1;background:#f2f8fe}
.pb.sp{border-color:#bfe3c9;background:#f1fbf3}
.pb.rt{border-color:#e9d6a8;background:#fffaf0}
.pb.off{opacity:.5}
.pb .ico{font-size:18px}
.empty{color:#a3b3c3;font-size:14px;padding:6px 2px}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.acts li{border:1px solid var(--line);border-radius:10px;padding:6px 32px 6px 10px;position:relative;font-size:14px;background:#fbfdff}
.acts li b{font-size:15px}
.acts li .nt{color:var(--sub);font-size:12px}
.acts li.error{background:var(--bad-bg);border-color:#f1b8c1}
.acts li.warn{background:var(--warn-bg);border-color:#f0dd9c}
.acts li .x{position:absolute;right:4px;top:4px;border:none;background:transparent;font-size:18px;color:#a3b3c3;cursor:pointer;padding:2px 6px}
.acts li .iss{color:#b03548;font-size:12px;font-weight:700}
.acts li .iss.w{color:#9a6a00}
.revealbox{border:2px dashed #e0a74b;background:#fff8ec;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;color:#8a5a00;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.revealbox .btn{margin-left:auto}

.grid{display:grid;grid-template-columns:22px repeat(5,52px);gap:5px;align-items:center}
.grid .el{font-weight:900;font-size:16px;text-align:center}
.cd{position:relative;width:52px;height:78px;border-radius:7px;cursor:pointer;border:2px solid transparent;padding:0;background:#ddd;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.18);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cd img{width:100%;height:100%;display:block;pointer-events:none}
.cd .cnt{position:absolute;right:2px;top:2px;background:var(--gold);color:#fff;font-weight:900;font-size:13px;border-radius:9999px;min-width:20px;height:20px;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cd.on{border-color:var(--gold);transform:translateY(-2px)}
.cd:active{transform:scale(.96)}
.tray{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:44px;background:#f4f9fd;border:1px dashed var(--line);border-radius:12px;padding:6px 8px;max-width:310px}
.tray .tc{display:inline-flex;align-items:center;gap:2px;border-radius:8px;padding:4px 8px;font-weight:900;font-size:16px;cursor:pointer;border:2px solid transparent}
.tray .hint{color:#a3b3c3;font-size:13px}
.tray .clr{margin-left:auto;border:none;background:#fff;border-radius:9999px;padding:4px 10px;font-weight:700;color:var(--sub);cursor:pointer;border:1px solid var(--line)}
.e0c{background:var(--e0s);color:#5d6670}.e1c{background:var(--e1s);color:#2a7f37}.e2c{background:var(--e2s);color:#1d64a8}.e3c{background:var(--e3s);color:#b23a1c}.e4c{background:var(--e4s);color:#8a6d00}
.cands{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto;padding-right:4px}
.cb{border:2px solid #b9d5f1;background:#f6fbff;border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.cb .t{font-size:17px;font-weight:900;display:flex;gap:8px;align-items:baseline}
.cb .t .pts{color:var(--pri-deep);font-size:15px}
.cb .t .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--sub)}
.cb .d{font-size:13px;color:var(--sub)}
.cb.job{border-color:#c9b8f0;background:#f7f3ff}
.cb.cov{border-color:#d7dee6;background:#f8fafc}
.cb.bad{border-color:#f1b8c1;background:#fff5f6}
.cb.bad .d{color:#b03548;font-weight:700}
.endbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.endbtns .btn{padding:11px 6px;font-size:15px}
.endbtns .btn.end{grid-column:span 4;font-size:18px;padding:13px}

/* ---- modal ---- */
.mw{position:fixed;inset:0;background:rgba(15,40,70,.55);display:flex;align-items:center;justify-content:center;z-index:1500;animation:fadeIn .12s ease;padding:10px}
.md{background:#fff;width:100%;max-width:560px;border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,.35);overflow:hidden;max-height:94vh;display:flex;flex-direction:column}
.md.wide{max-width:720px}
.md .hd{padding:16px 20px 6px;font-size:20px;font-weight:900;color:var(--pri-deep)}
.md .hd small{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:2px}
.md .bd{padding:8px 20px 14px;overflow:auto}
.md .ft{background:#f8f9fa;padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;text-align:left;font-size:17px;font-weight:800;cursor:pointer;color:var(--ink)}
.opt small{display:block;font-weight:500;color:var(--sub);font-size:13px}
.opt:hover{border-color:var(--pri);background:var(--pri-soft)}
.opt.row{display:inline-block}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.optrow .opt{flex:1;text-align:center;min-width:70px}
.frm{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:16px}
.frm select,.frm input{font-size:17px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:100%}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:10px 20px;border-radius:9999px;font-weight:700;z-index:2000;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:15px}

@media (max-width:1100px){
  .ops{grid-template-columns:1fr 1fr}
  .ops .col.a{grid-column:span 2}
}
@media (max-width:760px){
  .board{grid-template-columns:1fr 1fr}
  .board .center{grid-column:span 2;order:-1;flex-direction:row;flex-wrap:wrap}
  .ops{grid-template-columns:1fr}
  .ops .col.a{grid-column:auto}
  .vs-row{grid-template-columns:1fr}
  .vs-row .vs{padding:0;text-align:center}
}
</style>
</head>

<script>
/* =====================================================================
 * 五行戰鬥牌 5.17 規則資料（戰局記錄器用）
 * 陣法、職業、能力、精靈、秘計、星辰、環境、圖騰
 * 陣法的 run(E, c, o) 透過引擎 E 提供的操作來產生效果。
 * ===================================================================== */
(function (root) {
'use strict';

const EL = ['金', '木', '水', '火', '土'];
const ELI = { 金: 0, 木: 1, 水: 2, 火: 3, 土: 4 };
const GEN = [2, 3, 1, 4, 0];          // 金生水 木生火 水生木 火生土 土生金
const KE = [1, 4, 3, 0, 2];           // 金剋木 木剋土 水剋火 火剋金 土剋水
const MOTHER = [4, 2, 0, 1, 3];       // 生我者：土生金 水生木 金生水 木生火 火生土

const MODULES = [
  { id: 'basic', name: '基礎規則', fixed: true },
  { id: 'star', name: '星辰圖記' },
  { id: 'five', name: '五方傳說' },
  { id: 'hero', name: '英雄學派' },
  { id: 'spirit', name: '精靈' },
  { id: 'jianghu', name: '江湖' },
  { id: 'conf', name: '匯流世代' },
  { id: 'pouch', name: '錦囊' },
  { id: 'dark', name: '黑暗微光' },
  { id: 'totem', name: '圖騰法陣' },
  { id: 'retrieve', name: '棄牌回收' },
];

/* ---------- 牌 ---------- */
function card(s) {                    // '金3' -> {e:0,l:3}
  if (s && typeof s === 'object') return s;
  return { e: ELI[s[0]], l: +s[1] };
}
function cs(c) { return EL[c.e] + c.l; }
function cardsText(arr) { return arr.map(cs).join(''); }

/* ---------- 牌組判斷工具 ---------- */
const H = {
  n: c => c.length,
  cnt: (c, e) => c.filter(x => x.e === e).length,
  all: (c, e) => c.length > 0 && c.every(x => x.e === e),
  sum: c => c.reduce((a, x) => a + x.l, 0),
  sameL: c => c.length > 0 && c.every(x => x.l === c[0].l),
  diffE: c => new Set(c.map(x => x.e)).size === c.length,
  diffL: c => new Set(c.map(x => x.l)).size === c.length,
  // 精確屬性組成，例如 'ww' 以字串表示：H.exact(c, '金金火水')
  exact(c, spec) {
    if (c.length !== spec.length) return false;
    const need = [0, 0, 0, 0, 0];
    for (const ch of spec) need[ELI[ch]]++;
    for (const x of c) need[x.e]--;
    return need.every(v => v === 0);
  },
  // 至少包含 spec，其餘 extra 張任意
  contains(c, spec, extra) {
    if (c.length !== spec.length + extra) return false;
    const need = [0, 0, 0, 0, 0];
    for (const ch of spec) need[ELI[ch]]++;
    for (const x of c) if (need[x.e] > 0) need[x.e]--;
    return need.every(v => v === 0);
  },
  // X＋同級牌：兩張，其中一張屬性X，另一張與之同級
  xSame(c, e) { return c.length === 2 && c[0].l === c[1].l && (c[0].e === e || c[1].e === e); },
  chainGen(c) {                     // 三張連續相生
    if (c.length !== 3 || !H.diffE(c)) return false;
    const s = new Set(c.map(x => x.e));
    return c.some(x => s.has(GEN[x.e]) && s.has(GEN[GEN[x.e]]));
  },
  chainKe(c) {
    if (c.length !== 3 || !H.diffE(c)) return false;
    const s = new Set(c.map(x => x.e));
    return c.some(x => s.has(KE[x.e]) && s.has(KE[KE[x.e]]));
  },
  pairGen: c => c.length === 2 && (GEN[c[0].e] === c[1].e || GEN[c[1].e] === c[0].e),
  pairKe: c => c.length === 2 && (KE[c[0].e] === c[1].e || KE[c[1].e] === c[0].e),
  levels: (c, arr) => c.length === arr.length && c.map(x => x.l).sort().join() === arr.slice().sort().join(),
  // 任意張數 e 行牌，等級總和 >= n
  elemSum: (c, e, n) => H.all(c, e) && H.sum(c) >= n,
  // 雙屬性各任意張，各自總和 >= a / b
  twoElemSum(c, e1, n1, e2, n2) {
    if (!c.every(x => x.e === e1 || x.e === e2)) return false;
    const s1 = c.filter(x => x.e === e1).reduce((a, x) => a + x.l, 0);
    const s2 = c.filter(x => x.e === e2).reduce((a, x) => a + x.l, 0);
    return s1 >= n1 && s2 >= n2;
  },
  maxL: c => Math.max(0, ...c.map(x => x.l)),
};

/* ---------- 星辰 ---------- */
const STARS = [
  { e: 0, name: '金星‧太白', short: '太白', strike: '太白星擊', array: '太白鍊天陣' },
  { e: 1, name: '木星‧歲星', short: '歲星', strike: '歲星星擊', array: '歲星柱天陣' },
  { e: 2, name: '水星‧辰星', short: '辰星', strike: '辰星星擊', array: '辰星淬天陣' },
  { e: 3, name: '火星‧熒惑', short: '熒惑', strike: '熒惑星擊', array: '熒惑燎天陣' },
  { e: 4, name: '土星‧鎮星', short: '鎮星', strike: '鎮星星擊', array: '鎮星堪天陣' },
];
// 第2項效果：生我者可視為我（土→金、水→木、金→水、木→火、火→土）

/* ---------- 環境 ---------- */
const ENV_INVALID = [
  ['防禦', '氣壁', '暗黑氣壁'],
  ['幻化', '混沌', '暗黑混沌'],
  ['反震', '震暴', '暗黑震暴'],
  ['武器', '光芒', '暗黑光芒'],
  ['封印', '歸元', '暗黑歸元'],
];
const TOTEMS = [
  { e: 0, name: '白牙圖騰', protect: ['武器', '光芒'] },
  { e: 1, name: '青角圖騰', protect: ['防禦', '氣壁'] },
  { e: 2, name: '玄甲圖騰', protect: ['封印', '歸元'] },
  { e: 3, name: '朱羽圖騰', protect: ['反震', '震暴'] },
  { e: 4, name: '黃鱗圖騰', protect: ['幻化', '混沌'] },
];

/* =====================================================================
 * 陣法
 *   cat: 'attack' | 'active' | 'passive'
 *   atk: 0-4 五行攻擊 / 'P' 物理 / 'S' 特殊（僅攻擊）
 *   pats: 組成方式 [{m(c,X), need?, adj?, tag?}]
 *     need: 'job:<能力名>' 需職業能力；'form' 需擁有該陣法（職業/星辰）
 *   pts(c, X): 點數（c 已套用點數用等級）
 *   run(E, c, o): 效果
 * ===================================================================== */
const F = [];
function def(f) { f.pats = f.pats || []; F.push(f); return f; }

/* ----- 基礎規則 ----- */
EL.forEach((n, e) => def({
  id: n + '擊術', mod: 'basic', basic: true, size: 1, cat: 'attack', atk: e,
  pats: [{ m: c => c.length === 1 && c[0].e === e }],
  pts: c => H.sum(c) + 4,
  run: (E, c, o) => E.attack(o.pts),
}));
def({ id: '武器', mod: 'basic', basic: true, size: 2, cat: 'attack', atk: 'P',
  pats: [{ m: c => H.exact(c, '金金') }, { m: c => c.length === 2 && H.cnt(c, 0) >= 1, need: 'job:武器專精', tag: '武器專精' }],
  pts: (c, X) => H.sum(c) * 2 * (X.ab('狂影') && H.exact(X.printed || c, '金金') ? 2 : 1),
  run: (E, c, o) => { E.attack(o.pts); if (E.ab('武器精研')) E.draw(1, '武器精研'); } });
def({ id: '防禦', mod: 'basic', basic: true, size: 2, cat: 'passive', counter: 'nullAtk',
  pats: [{ m: c => H.exact(c, '木木') }, { m: c => c.length === 2 && H.cnt(c, 1) >= 1, need: 'job:防禦專精', tag: '防禦專精' }] });
def({ id: '封印', mod: 'basic', basic: true, size: 2, cat: 'passive', counter: 'nullSpell',
  pats: [{ m: c => H.exact(c, '水水') }, { m: c => c.length === 2 && H.cnt(c, 2) >= 1, need: 'job:封印專精', tag: '封印專精' }] });
def({ id: '反震', mod: 'basic', basic: true, size: 2, cat: 'passive', counter: 'split',
  pats: [{ m: c => H.exact(c, '火火') }, { m: c => c.length === 2 && H.cnt(c, 3) >= 1, need: 'job:反震專精', tag: '反震專精' }] });
def({ id: '幻化', mod: 'basic', basic: true, size: 2, cat: 'active',
  pats: [{ m: c => H.exact(c, '土土') }, { m: c => c.length === 2 && H.cnt(c, 4) >= 1, need: 'job:幻化專精', tag: '幻化專精' }],
  run: (E, c, o) => E.metamorph(c) });
def({ id: '空城', mod: 'basic', basic: true, size: 2, cat: 'passive', counter: null,
  pats: [{ m: c => c.length === 2 && c[0].e !== c[1].e }] });
const TRI = ['鍠金', '樸木', '洄水', '熾火', '坱土'];
TRI.forEach((n, e) => def({
  id: n, mod: 'basic', basic: true, size: 3, cat: 'attack', atk: e,
  pats: [{ m: c => c.length === 3 && H.all(c, e) },
    { m: c => c.length === 3 && H.cnt(c, e) === 2, need: 'job:' + n + '專精', adj: -6, tag: n + '專精', noStar: true }],
  pts: c => H.sum(c) * 3,
  run: (E, c, o) => {
    E.attack(o.pts);
    if (o.pts >= 30 && (!o.pat.noStar || E.ab('法粹'))) E.summonStar(e);
  },
}));
def({ id: '生陣', mod: 'basic', basic: true, size: 3, cat: 'active',
  pats: [{ m: H.chainGen }, { m: H.pairGen, need: 'job:生陣專精', tag: '生陣專精' }],
  pts: c => H.sum(c) * 3, run: (E, c, o) => E.heal(E.me, o.pts, { formation: true }) });
def({ id: '剋陣', mod: 'basic', basic: true, size: 3, cat: 'active',
  pats: [{ m: H.chainKe }, { m: H.pairKe, need: 'job:剋陣專精', tag: '剋陣專精' }],
  pts: c => H.sum(c) * 3, run: (E, c, o) => E.shieldDown(E.opp, o.pts) });
def({ id: '光芒', mod: 'basic', basic: true, size: 4, cat: 'active',
  pats: [{ m: c => H.exact(c, '金金火水') }, { m: c => H.contains(c, '金金火', 1), need: 'job:光芒專精', tag: '光芒專精' }],
  run: (E) => { if (E.immuneShadow()) return E.note('影遁：不受光芒影響');
    E.view(); E.status(E.opp, 'stun', 2); E.status(E.opp, 'nodraw', 2); E.xianshu(); } });
def({ id: '氣壁', mod: 'basic', basic: true, size: 4, cat: 'active',
  pats: [{ m: c => H.exact(c, '木木金火') }, { m: c => H.contains(c, '木木金', 1), need: 'job:氣壁專精', tag: '氣壁專精' }],
  pts: c => H.sum(c) * 4, run: (E, c, o) => { E.buildShield(E.me, o.pts); E.xianshu(); } });
def({ id: '歸元', mod: 'basic', basic: true, size: 4, cat: 'active',
  pats: [{ m: c => H.exact(c, '水水土木') }, { m: c => H.contains(c, '水水土', 1), need: 'job:歸元專精', tag: '歸元專精' }],
  pts: c => H.sum(c) * 4, run: (E, c, o) => { E.heal(E.me, o.pts, { formation: true }); E.xianshu(); } });
def({ id: '震暴', mod: 'basic', basic: true, size: 4, cat: 'attack', atk: 'P',
  pats: [{ m: c => H.exact(c, '火火水土') }, { m: c => H.contains(c, '火火水', 1), need: 'job:震暴專精', tag: '震暴專精' }],
  pts: c => H.sum(c) * 4,
  run: (E, c, o) => { E.attack(o.pts); if (E.ab('戰魄')) { E.status(E.opp, 'stun', 1, '戰魄'); E.status(E.opp, 'nodraw', 1, '戰魄'); } E.xianshu(); } });
def({ id: '混沌', mod: 'basic', basic: true, size: 4, cat: 'active',
  pats: [{ m: c => H.exact(c, '土土木金') }, { m: c => H.contains(c, '土土木', 1), need: 'job:混沌專精', tag: '混沌專精' }],
  run: (E) => { if (E.immuneShadow()) return E.note('影遁：不受混沌影響'); E.view(); E.handDelta(E.opp, -2, '放回牌堆'); E.xianshu(); } });
def({ id: '五行輪迴', mod: 'basic', basic: true, size: 5, cat: 'active',
  pats: [{ m: c => c.length === 5 && H.diffE(c) }, { m: c => c.length === 4 && H.diffE(c), need: 'job:五行輪迴專精', tag: '五行輪迴專精' }],
  run: E => E.swapHp() });
def({ id: '五流歸一', mod: 'basic', basic: true, size: 5, cat: 'attack', atk: 'S',
  pats: [{ m: c => c.length === 5 && H.sameL(c) }, { m: c => c.length === 4 && H.sameL(c), need: 'job:五流歸一專精', adj: -15, tag: '五流歸一專精' }],
  pts: (c, X) => X.oppHand * 15 + (X.ab('純陽勁') ? 15 : 0),
  run: (E, c, o) => {
    if (E.ab('極陽勁')) { E.breakShield(E.opp, '極陽勁'); }
    E.attack(o.pts); E.draw(1, '五流歸一');
    if (E.ab('極陽勁')) E.status(E.opp, 'stun', 1, '極陽勁');
  } });

/* ----- 星辰圖記 ----- */
def({ id: '虛空破星術', mod: 'star', size: 3, cat: 'active', voidArt: true,
  pats: [{ m: c => c.length === 3 && H.sameL(c) }], run: E => E.voidStar() });
STARS.forEach(s => {
  def({ id: s.strike, mod: 'star', size: 1, cat: 'attack', atk: s.e, star: s.e,
    pats: [{ m: c => c.length === 1 && c[0].e === s.e, need: 'form' }], pts: () => 10, run: (E, c, o) => E.attack(o.pts) });
  def({ id: s.array, mod: 'star', size: 3, cat: 'attack', atk: s.e, star: s.e,
    pats: [{ m: c => H.exact(c, EL[s.e] + EL[s.e] + EL[MOTHER[s.e]]), need: 'form' }],
    pts: c => H.sum(c) * 3, run: (E, c, o) => { E.attack(o.pts); E.draw(1, s.array); E.breakOwnStar(s.e); } });
});

/* ----- 五方傳說 ----- */
const BEASTS = ['西‧白虎', '東‧青龍', '北‧玄武', '南‧朱雀', '中‧黃蛇'];
BEASTS.forEach((n, e) => def({
  id: n, mod: 'five', size: 5, cat: 'attack', atk: e, beast: true,
  pats: [{ m: c => c.length === 5 && H.all(c, e) }], pts: () => 81,
  run: (E, c, o) => { E.attack(o.pts); E.setEnv(e); },
}));
def({ id: '虛空斷脈術', mod: 'five', size: 3, cat: 'active', voidArt: true,
  pats: [{ m: c => c.length === 3 && H.sameL(c) }], run: E => E.voidEnv() });

/* ----- 英雄學派 ----- */
def({ id: '虛空返璞術', mod: 'hero', size: 3, cat: 'active', voidArt: true,
  pats: [{ m: c => c.length === 3 && H.sameL(c) }], run: (E, c) => E.voidJob(c[0].l <= 2) });
def({ id: '神兵', mod: 'hero', size: 2, cat: 'attack', atk: 'P', pats: [{ m: c => H.xSame(c, 0), need: 'form' }],
  pts: c => H.sum(c) * 3, run: (E, c, o) => E.attack(o.pts) });
def({ id: '落光斬', mod: 'hero', size: 4, cat: 'attack', atk: 'P', pats: [{ m: c => H.exact(c, '金金火火'), need: 'form' }],
  pts: c => H.sum(c) * 6, run: (E, c, o) => E.attack(o.pts) });
def({ id: '道禦', mod: 'hero', size: 2, cat: 'attack', atk: 'S', pats: [{ m: c => H.xSame(c, 1), need: 'form' }],
  pts: c => H.sum(c) * 3, run: (E, c, o) => { E.attack(o.pts); E.counter('nullAtk', '道禦'); } });
def({ id: '轉生術', mod: 'hero', size: 4, cat: 'active',
  pats: [{ m: c => zhuanSheng(c).length > 0, need: 'form' }],
  choice: c => { const w = zhuanSheng(c); return w.length > 1 ? { key: 'wood', title: '轉生術：指定單獨的木行牌', options: w.map(l => ({ v: l, label: '木' + l + '（' + l * 25 + '點）' })) } : null; },
  pts: (c, X) => { const w = zhuanSheng(c); const pick = X.choice && X.choice.wood; return (w.includes(pick) ? pick : Math.max(...w)) * 25; },
  run: (E, c, o) => E.heal(E.me, o.pts, { formation: true }) });
function zhuanSheng(c) {            // 回傳可作為「單獨木」的等級
  if (c.length !== 4) return [];
  const out = new Set();
  c.forEach((x, i) => {
    if (x.e !== 1) return;
    const rest = c.filter((_, j) => j !== i);
    if (H.chainGen(rest) && H.sum(rest) >= 10) out.add(x.l);
  });
  return [...out];
}
def({ id: '幻印', mod: 'hero', size: 2, cat: 'attack', atk: 'S', pats: [{ m: c => H.xSame(c, 2), need: 'form' }],
  pts: c => H.sum(c) * 3, run: (E, c, o) => { E.attack(o.pts); E.counter('nullSpell', '幻印'); } });
def({ id: '紫光防罩', mod: 'hero', size: 5, cat: 'active', pats: [{ m: c => H.contains(c, '水水', 3), need: 'form' }],
  pts: c => H.sum(c) * 5, run: (E, c, o) => E.buildShield(E.me, o.pts) });
def({ id: '法震', mod: 'hero', size: 2, cat: 'attack', atk: 'S', pats: [{ m: c => H.xSame(c, 3), need: 'form' }],

  run: r.run }));
function resPair(c, e, l) {
  return (c[0].e === e && c[1].l === l) || (c[1].e === e && c[0].l === l);
}
def({ id: '千鳴', mod: 'conf', size: 3, cat: 'active',
  pats: [{ m: (c, X) => X.res && c.length === 3 && qianMing(c, X.res), need: 'form' }],
  choice: (c, X) => ({ key: 'res', title: '千鳴：指定另一個五鳴術', options: RES.filter(r => !X.res || r.e !== X.res.e).map(r => ({ v: r.id, label: r.id })) }),
  run: (E, c, o) => {
    const own = RES.find(r => E.res() && r.e === E.res().e);
    if (own) own.run(E);
    const other = RES.find(r => r.id === (o.choice && o.choice.res));
    if (other) other.run(E); else E.issue('warn', '千鳴未指定第二個五鳴術');
  } });
function qianMing(c, res) {         // 餘行牌＋餘級牌＋餘行餘級牌
  const perms = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  return perms.some(([a, b, d]) => c[a].e === res.e && c[b].l === res.l && c[d].e === res.e && c[d].l === res.l);
}

/* =====================================================================
 * 陣法辨識
 *   printed: 記錄者點選的牌（牌面）
 *   X: { state 取用函式、本回合修正 }
 *     X.enabled(mod) X.ab(name) X.hasForm(id) X.star (隊伍星辰 e|null)
 *     X.tempStar (瞞天) X.levelLayers [{idx, l}] X.allPlus (偷梁)
 *     X.virtual {e,l,kind:'幻術'|'幻朧'} X.res {e,l}
 * ===================================================================== */
function recognize(printed, X) {
  printed = printed.map(card);
  const results = [];
  const seen = new Set();
  const base = applyLevels(printed, X);
  const variants = [{ cards: base, notes: [], basicOnly: false }];
  // 烈陽訣：+2 只限基礎陣法
  if (X.lieyang) {
    const v = base.map(x => ({ ...x }));
    let hit = false;
    for (const x of v) if (!hit && x.e === X.lieyang.e && x.l === X.lieyang.l) { x.l = Math.min(5, x.l + 2); hit = true; }
    if (hit) variants.push({ cards: v, notes: ['烈陽訣＋2'], basicOnly: true, lieyang: true });
  }
  // 幻術/幻朧 虛擬牌
  if (X.virtual) {
    const vs = variants.map(v => ({ cards: v.cards.concat([{ e: X.virtual.e, l: X.virtual.l, virtual: true }]),
      notes: v.notes.concat([X.virtual.kind + '：' + cs(X.virtual)]), basicOnly: true, virtualKind: X.virtual.kind, lieyang: v.lieyang }));
    variants.push(...vs);
  }
  // 星辰屬性替換（一張牌，限基礎陣法）
  const stars = [];
  if (X.star != null) stars.push({ e: X.star, src: '星辰' });
  if (X.tempStar != null && X.tempStar !== X.star) stars.push({ e: X.tempStar, src: '瞞天' });
  // 重播時，即使目前沒有星辰也嘗試替換，以便標示「沒有星辰」而非辨識失敗
  if (X.forReplay && !stars.length) for (let e = 0; e < 5; e++) stars.push({ e, src: '星辰' });
  const extra = [];
  for (const v of variants) {
    for (const s of stars) {
      v.cards.forEach((x, i) => {
        if (x.e !== MOTHER[s.e] || x.virtual) return;
        const nc = v.cards.map((y, j) => (j === i ? { ...y, e: s.e, sub: true } : y));
        extra.push({ ...v, cards: nc, notes: v.notes.concat([s.src + '：' + cs(x) + '→' + EL[s.e]]), basicOnly: true });
      });
    }
    // 瞞天與原有星辰各改一張
    if (stars.length === 2) {
      const [a, b] = stars;
      v.cards.forEach((x, i) => v.cards.forEach((y, j) => {
        if (i === j || x.e !== MOTHER[a.e] || y.e !== MOTHER[b.e] || x.virtual || y.virtual) return;
        const nc = v.cards.map((z, k) => (k === i ? { ...z, e: a.e, sub: true } : k === j ? { ...z, e: b.e, sub: true } : z));
        extra.push({ ...v, cards: nc, notes: v.notes.concat(['星辰＋瞞天替換']), basicOnly: true });
      }));
    }
  }
  variants.push(...extra);
  // 聖術：一張４級以上牌視為兩張（基礎四張陣法）
  if (X.ab('聖術')) {
    const sv = [];
    for (const v of variants) {
      if (v.cards.some(x => x.sub)) continue;      // 聖術無法搭配星辰改變屬性
      v.cards.forEach((x, i) => {
        if (x.l < 4) return;
        sv.push({ ...v, cards: v.cards.concat([{ ...x, dup: true }]), notes: v.notes.concat(['聖術：' + cs(x) + '視為兩張']), basicOnly: true, sacred: true });
      });
    }
    variants.push(...sv);
  }

  for (const v of variants) {
    for (const f of F) {
      if (v.basicOnly && !f.basic) continue;
      if (v.sacred && f.size !== 4) continue;
      if (v.virtualKind === '幻術' && !/擊術$/.test(f.id)) continue;
      if (f.mod !== 'basic' && X.enabled && !X.enabled(f.mod)) continue;
      f.pats.forEach((p, pi) => {
        let ok = false;
        try { ok = p.m(v.cards, X); } catch (e) { ok = false; }
        if (!ok) return;
        const reasons = [];
        if (p.need === 'form' && !ownsForm(f, X)) reasons.push(formNeedText(f));
        if (p.need && p.need.startsWith('job:') && !X.ab(p.need.slice(4))) reasons.push('需要' + p.need.slice(4));
        if (v.notes.some(n => /^星辰/.test(n)) && X.star == null) reasons.push('沒有星辰');
        const key = f.id + '|' + pi + '|' + v.notes.join(',');
        if (seen.has(key)) return;
        seen.add(key);
        results.push({ f, pat: p, pi, cards: v.cards, notes: v.notes.concat(p.tag ? [p.tag] : []), legal: reasons.length === 0, reasons,
          mods: v.notes.length + (p.need ? 1 : 0) });
      });
    }
  }
  // 排序：合法優先、修正少者優先；同陣法只保留最佳一筆合法解讀
  results.sort((a, b) => (b.legal - a.legal) || (a.mods - b.mods));
  if (X.all) return results;          // 重播：保留所有解讀，以便對應原本登錄的那一種
  const out = [], seenF = new Set();
  for (const r of results) {          // 已排序：每個陣法取第一筆（合法者優先）
    if (seenF.has(r.f.id)) continue;
    seenF.add(r.f.id);
    out.push(r);
  }
  return out;
}
function ownsForm(f, X) {
  if (f.star != null) return X.star === f.star || X.tempStar === f.star;
  return X.hasForm(f.id);
}
function formNeedText(f) {
  if (f.star != null) return '需要' + STARS[f.star].name;

    if (S.spirit[p] && S.spirit[p].p <= 0) { S.spirit[p] = null; ar.notes.push('精靈靈力歸０消失'); }
  },

  formation(S, m, mods, T, a, ar) { doFormation(S, m, mods, T, a, ar); },

  cover(S, m, mods, T, a, ar) {
    const p = T.p;
    const n = a.cards && a.cards.length ? a.cards.length : (a.n || 2);
    ar.text = '覆蓋被動術式（' + (a.cards && a.cards.length ? cardsText(a.cards.map(card)) : n + '張') + (a.form ? '，' + a.form : '') + '）';
    if (stunned(S, T, p)) ar.issues.push(iss('error', '無法行動中卻覆蓋被動術式'));
    S.hand[p] -= n;
    const fx = revealOpp(S, m, T, ar, { cat: 'passive' });
    let form = a.form || null;
    if (a.cards && a.cards.length && form) {
      const r = R.recognizePassive(a.cards, ctxX(S, m, T, p, { forReplay: true })).find(x => x.f.id === form);
      if (!r) ar.issues.push(iss('error', '這些牌無法構成' + form));
      else if (!r.legal) ar.issues.push(iss('error', form + '：' + r.reasons.join('、')));
    }
    S.covered[p] = { ti: T.i, form, n, sealed: !!fx.sealed, revealCard: has(S, p, 'reveal') };
    S.lastForm[p] = { id: form || '被動術式', cat: 'passive', size: n, turn: T.i, basic: !!(form && FMAP[form] && FMAP[form].basic) };
    if (fx.sealed) ar.notes.push('被封印，翻開時無效果');
    if (S.covered[p].revealCard) ar.notes.push('聖光破：須正面展示');
  },

  job(S, m, mods, T, a, ar) {
    const p = T.p, q = T.q;
    const cards = (a.cards || []).map(card);
    ar.text = '轉職' + a.job + (cards.length ? '（' + cardsText(cards) + '）' : '');
    if (stunned(S, T, p)) ar.issues.push(iss('error', '無法行動中卻轉職'));
    const r = R.recognizeJobs(cards, ctxX(S, m, T, p)).find(x => x.job.id === a.job);
    if (!r) ar.issues.push(iss('error', '這些牌不符合' + a.job + '的轉職條件（' + (JMAP[a.job] ? JMAP[a.job].costText : '') + '）'));
    else {
      if (!r.legal) ar.issues.push(iss('error', r.reasons.join('、')));
      if (r.path) ar.text = '轉職' + a.job + '（' + r.path + '：' + cardsText(cards) + '）';
    }
    S.hand[p] -= cards.length;
    revealOpp(S, m, T, ar, { cat: 'job' });
    changeJob(S, T, ar, p, a.job, cards);
    S.lastForm[p] = null;
  },

  pass(S, m, mods, T, a, ar) {
    const p = T.p;
    const st = stunned(S, T, p);
    ar.text = st ? '無法行動' : (S.hand[p] <= 0 ? '沒有手牌，無法行動' : '跳過行動');
    if (!st && S.hand[p] > 0) ar.issues.push(iss('error', '可以行動卻沒有行動（未處於無法行動狀態且有手牌）'));
    revealOpp(S, m, T, ar, { cat: 'pass' });
    S.lastForm[p] = null;
  },

  discard(S, m, mods, T, a, ar) {
    const p = T.p;
    if (a.none) { ar.text = '沒有棄牌'; T.discardNone = true; return; }
    const c = card(a.card);
    ar.text = '棄牌' + cs(c);
    if (T.discarded) ar.issues.push(iss('error', '本回合已登錄過棄牌'));
    T.discarded = c;
    S.lastDiscard[p] = { card: cs(c), turn: T.i };
    const sp = S.spirit[p];
    if (sp && SPIRITS[sp.k] && SPIRITS[sp.k].gain(c)) {
      if (has(S, p, 'lishan')) ar.notes.push('離山：靈力無法增加');
      else if (sp.p < 6) { sp.p++; ar.notes.push(sp.k + '精靈靈力＋1'); }
    }
  },
};

/* ---------------- 施展陣法 ---------------- */
function doFormation(S, m, mods, T, a, ar) {
  const p = T.p, q = T.q;
  const f = FMAP[a.form];
  const printed = (a.cards || []).map(card);
  ar.text = a.form + '（' + cardsText(printed) + '）';
  if (!f) { ar.issues.push(iss('error', '未知陣法')); return; }
  if (stunned(S, T, p)) ar.issues.push(iss('error', '無法行動中卻施展陣法'));
  // 江湖狀態於本回合立即生效
  if (f.preStatus) addStatus(S, T, ar, p, f.preStatus, 2, f.id, true);
  const X = ctxX(S, m, T, p, { forReplay: true, choice: a.choice || {} });
  X.all = true;
  const cands = R.recognize(printed, X).filter(r => r.f.id === f.id);
  const piOk = x => a.pi == null || x.pi === a.pi;
  let r = (a.via != null && cands.find(x => piOk(x) && x.notes.join(',') === a.via))
    || cands.find(x => piOk(x) && x.legal) || cands.find(piOk) || cands[0];
  if (!r) {
    ar.issues.push(iss('error', '這些牌無法構成' + f.id));
    r = { f, pat: f.pats[0] || {}, cards: printed.map(x => ({ ...x })), notes: [], legal: false, reasons: [] };
  } else if (!r.legal) ar.issues.push(iss('error', f.id + '：' + r.reasons.join('、')));
  if (r.notes.length) ar.text = a.form + '（' + cardsText(printed) + '，' + r.notes.join('，') + '）';
  if (T.virtual && !r.cards.some(x => x.virtual)) ar.issues.push(iss('error', T.virtual.kind + '產生的牌必須於本回合使用'));
  if (T.virtual && T.virtual.kind === '幻術' && !/擊術$/.test(f.id)) ar.issues.push(iss('error', '幻術產生的牌只能施展五行擊術'));
  if (f.limited) useLimited(S, T, ar, p, f.limited);
  if (f.mod !== 'basic' && !mods.has(f.mod)) ar.issues.push(iss('error', '未啟用此規則模組'));
  // 手牌
  S.hand[p] -= printed.length;

  // 虛空追尋者以５５５施展虛空術 → 先轉職虛空破滅者
  if (f.voidArt && abOf(S, T, p, '虛空追尋') && H.levels(printed, [5, 5, 5])) {
    ar.notes.push('虛空追尋：轉職虛空破滅者');
    changeJob(S, T, ar, p, '虛空破滅者', []);
  }

  // 點數
  let pts;
  const atkType = f.atk === 'choice' ? (a.choice && a.choice.el != null ? +a.choice.el : null) : f.atk;
  if (f.pts) {
    let pc = r.cards.filter(x => !x.dup).map(x => ({ e: x.e, l: x.l }));
    if (f.cat === 'attack' && has(S, p, 'qianfeng')) pc = pc.map(x => ({ e: x.e, l: Math.min(5, x.l + 1) }));
    pts = f.pts(pc, { ab: n => abOf(S, T, p, n), oppHand: S.hand[q], printed: r.cards.map(x => ({ e: x.e, l: x.l })), choice: a.choice || {} });
    pts += (r.pat && r.pat.adj) || 0;
    pts = Math.max(0, Math.ceil(pts));
  }
  if (f.atk === 'choice' && atkType == null) ar.issues.push(iss('warn', '南靈陣未選擇屬性'));
  const isAtk = f.cat === 'attack';
  if (pts != null) ar.text += pts + '點';

  // 翻開上家被動術式 + 本回合受到的反制
  const fx = revealOpp(S, m, T, ar, { cat: f.cat, f, pts, atkType });
  const o = { pts, pat: r.pat, choice: a.choice || {}, f };
  const E = makeE(S, m, T, ar, o, fx, f, atkType);

  // 環境使陣法無效
  let envNull = false;
  if (S.env != null && ENV_INVALID[S.env].includes(f.id)) {
    const tot = S.totem[p] != null && TOTEMS[S.totem[p]].protect.includes(f.id) && TOTEMS[S.totem[p]].e === S.totem[p];
    const dark = f.dark && abOf(S, T, p, '暗境');
    if (!tot && !dark) { envNull = true; ar.notes.push(EL[S.env] + '行環境：' + f.id + '無效'); }
  }
  // 術式被封印
  const spellNull = (f.cat === 'active') && fx.nullSpell;
  if (spellNull) ar.notes.push('術式被無效');

  if (!envNull && !spellNull && f.run) f.run(E, r.cards.filter(x => !x.dup), o);

  // 暗行：施展暗黑陣法時轉職暗靈使
  if (f.dark && f.id.startsWith('暗黑') && S.job[p] === '暗行者' && !lishan(S, T, p)) { ar.notes.push('暗行：轉職暗靈使'); changeJob(S, T, ar, p, '暗靈使', []); }
  // 舞陽訣
  if (T.wuyang && isAtk && printed.length >= 3 && (atkType === 1 || atkType === 3)) addDraw(T, ar, 1, '舞陽訣');

  S.lastForm[p] = { id: f.id, cat: f.cat, atk: isAtk ? atkType : null, size: f.size === 0 ? 0 : (r.cards.filter(x => !x.virtual).length + r.cards.filter(x => x.dup).length * 0) || printed.length, ruleSize: f.size, cards: printed.map(cs), turn: T.i, basic: !!f.basic };
  S.lastForm[p].size = printed.length + (r.cards.some(x => x.virtual) ? 1 : 0);
}

/* 翻開上家的被動術式，並彙整本回合行動受到的反制效果 */
function revealOpp(S, m, T, ar, info) {
  const p = T.p, q = T.q;
  const fx = { nullAtk: false, nullSpell: false, split: false, nullAtk40: false, sealed: false, src: [] };
  const isAtk = info.cat === 'attack';
  const f = info.f;
  const ignoreFormFx = isAtk && (has(S, p, 'taxue') || (f && f.beast));
  const windwalk = isAtk && info.pts != null && info.pts <= 15 && abOf(S, T, p, '風行術');
  const immuneCounter = T.cicada || ignoreFormFx || windwalk;
  const daoyuan = abOf(S, T, p, '道源');
  if (!T.revealed) {
    T.revealed = true;
    const cv = S.covered[q];
    if (cv) {
      S.covered[q] = null;
      const pf = cv.form ? FMAP[cv.form] : null;
      if (!cv.form) ar.issues.push(iss('warn', '上家覆蓋的被動術式尚未補登內容'));
      let msg = '翻開上家' + (cv.form || '被動術式');
      if (cv.sealed) msg += '（已被封印，無效果）';
      else if (pf && pf.counter) {
        const k = pf.counter;
        if (k === 'poison') {
          if (T.cicada) msg += '（金蟬：不受影響）';
          else { addPoison(S, T, ar, p, 1, q); msg += '，中毒1回合'; }
        } else if (immuneCounter) {
          msg += T.cicada ? '（金蟬：不受影響）' : windwalk ? '（風行術：不受影響）' : '（不受其他陣法效果影響）';
        } else {
          applyCounter(fx, k, info, daoyuan, pf.id);
        }
      }
      ar.notes.unshift(msg);
    }
  }
  // 上家先前施展的攻擊附帶反制（道禦、幻印、法震、流影殘光劍）與石盾、觀火
  S.statuses.filter(s => s.who === p).forEach(s => {
    if (['nullAtk', 'nullSpell', 'split', 'nullAtk40'].includes(s.k)) {
      if (immuneCounter && s.src !== '幻化') { /* 金蟬/踏雪/聖獸/風行術 */ } else applyCounter(fx, s.k, info, daoyuan, s.src);
    }
  });
  fx.shidun = isAtk && has(S, p, 'shidun');
  fx.guanhuo = has(S, p, 'guanhuo') && !T.cicada;
  return fx;
}
function applyCounter(fx, k, info, daoyuan, src) {
  const isAtk = info.cat === 'attack';
  if (k === 'nullAtk' && isAtk) { fx.nullAtk = true; fx.src.push(src); }
  if (k === 'split' && isAtk) { fx.split = true; fx.src.push(src); }
  if (k === 'nullAtk40' && isAtk && info.pts <= 40) { fx.nullAtk = true; fx.src.push(src); }
  if (k === 'nullSpell' && !daoyuan) {
    if (info.cat === 'active') { fx.nullSpell = true; fx.src.push(src); }
    if (info.cat === 'passive') { fx.sealed = true; fx.src.push(src); }
  }
}

/* 陣法效果操作 */
function makeE(S, m, T, ar, o, fx, f, atkType) {
  const p = T.p, q = T.q;
  const E = {
    me: p, opp: q,
    ab: n => abOf(S, T, p, n),
    hp: who => S.hp[who],
    hasStatus: (who, k) => has(S, who, k),
    meteor: () => T.meteor,
    res: () => T.res,
    oppLastFormSize: () => { const lf = S.lastForm[q]; return lf && lf.turn === T.i - 1 ? (lf.ruleSize === 0 ? 0 : lf.size) : 0; },
    note: s => ar.notes.push(s),
    issue: (lv, s) => ar.issues.push(iss(lv, s)),
    attack: pts => doAttack(S, T, ar, o, fx, f, atkType, pts),
    heal: (who, n, opt) => healHp(S, T, ar, who, n, f.id, true, fx),
    lose: (who, n, opt) => loseHp(S, T, ar, who, n, f.id, true, false, fx),
    buildShield: (who, n) => buildShield(S, ar, who, n),
    shieldDown: (who, n) => { const b = S.shield[who]; S.shield[who] = Math.max(0, b - n); ar.notes.push(b ? '扣除防護罩' + Math.min(b, n) + '點' : '對方沒有防護罩'); },
    breakShield: (who, src) => { if (S.shield[who]) { S.shield[who] = 0; ar.notes.push(src + '：破除防護罩'); } },
    status: (who, k, n, src) => addStatus(S, T, ar, who, k, n, src || f.id),
    counter: (k, src) => { S.statuses.push({ who: q, k, left: 1, unit: 'turn', src }); },
    draw: (n, src) => addDraw(T, ar, n, src),
    noDraw: src => { T.noDraw = true; ar.notes.push(src + '：本回合無法抽牌'); },
    handDelta: (who, d, src) => { S.hand[who] = Math.max(0, S.hand[who] + d); },
    swapHp: () => { if (fx.guanhuo) return ar.notes.push('觀火：生命交換無效'); const t = S.hp[0]; S.hp[0] = S.hp[1]; S.hp[1] = t; ar.notes.push('雙方生命交換'); },
    halveHp: who => { const n = S.hp[who] - Math.floor(S.hp[who] / 2); loseHp(S, T, ar, who, n, f.id, true, false, fx, '生命減半'); },
    summonStar: e => summonStar(S, T, ar, p, e, o.copy),
    breakOwnStar: e => { if (S.star[p] === e) { S.star[p] = null; ar.notes.push('破除' + STARS[e].name); } },
    voidStar: () => {
      let any = false;
      [0, 1].forEach(w => { if (S.star[w] != null) { ar.notes.push('破除' + STARS[S.star[w]].name); S.star[w] = null; any = true; loseHp(S, T, ar, w, 20, f.id, true, false, fx); } });
      if (!any) ar.notes.push('場上沒有星辰');
    },
    setEnv: e => { S.env = e; ar.notes.push('轉移為' + EL[e] + '行環境'); },
    voidEnv: () => {
      if (S.env == null) return ar.notes.push('目前沒有環境');
      ar.notes.push('破除' + EL[S.env] + '行環境'); S.env = null;
      if (S.totem[0] != null || S.totem[1] != null) { S.totem = [null, null]; ar.notes.push('破除所有圖騰'); }
      loseHp(S, T, ar, p, 20, f.id, true, false, fx); loseHp(S, T, ar, q, 20, f.id, true, false, fx);
    },
    voidJob: low => {
      [0, 1].forEach(w => {
        const j = S.job[w] && JMAP[S.job[w]];
        if (!j) return;
        if (low && j.legend) return ar.notes.push(S.job[w] + '為傳說職業，不受影響');
        if (j.allAb.includes('虛空境界') && limitedLeft(S, w, '虛空境界') > 0) { S.uses[w]['虛空境界'] = (S.uses[w]['虛空境界'] || 0) + 1; return ar.notes.push('虛空境界：' + S.job[w] + '不會被破除'); }
        ar.notes.push('破除' + m.players[w] + '的' + S.job[w]); S.job[w] = null;
      });
      loseHp(S, T, ar, p, 20, f.id, true, false, fx);
    },
    breakOwnJob: () => { if (S.job[p]) { ar.notes.push('破除' + S.job[p]); S.job[p] = null; } },
    summonSpirit: (k, darkArray) => {
      const sp = S.spirit[p];
      if (darkArray && sp && sp.k === k) { sp.p = Math.min(6, sp.p + 2); ar.notes.push(k + '精靈靈力＋2'); return; }
      S.spirit[p] = { k, p: 2, id: ++S.spiritSeq }; ar.notes.push('召喚' + k + '精靈');
    },
    voidSpirit: () => {
      [0, 1].forEach(w => {
        const sp = S.spirit[w];
        if (!sp) return;
        sp.p -= 2;
        if (sp.p <= 0) {
          S.spirit[w] = null; ar.notes.push(m.players[w] + '的' + sp.k + '精靈消失');
          if ((sp.k === '惡' || sp.k === '死') && S.job[w] === '魔靈師' && !lishan(S, T, w)) {
            S.job[w] = null; S.spirit[w] = { k: sp.k, p: 2, id: ++S.spiritSeq }; ar.notes.push('魔靈復甦：破除魔靈師並召喚' + sp.k + '精靈');
          }
        } else ar.notes.push(m.players[w] + '的' + sp.k + '精靈靈力－2');
        loseHp(S, T, ar, w, 20, f.id, true, false, fx);
      });
    },
    voidWall: () => {
      [0, 1].forEach(w => { if (S.shield[w] > 0) { S.shield[w] = Math.max(0, S.shield[w] - 20); ar.notes.push(m.players[w] + '防護罩－20'); loseHp(S, T, ar, w, 20, f.id, true, false, fx); } });
    },
    view: () => {
      if (S.spirit[p] && S.spirit[p].k === '惡' && !lishan(S, T, p)) {
        const mx = o.choice && o.choice.viewMax;
        if (mx) loseHp(S, T, ar, q, mx * 2, '戲鬧', false); else ar.issues.push(iss('warn', '戲鬧：未輸入檢視到的最高等級'));
      }
    },
    immuneShadow: () => abOf(S, null, q, '影遁'),
    xianshu: () => { if (abOf(S, T, p, '仙術')) addDraw(T, ar, 1, '仙術'); },
    poison: (who, n) => addPoison(S, T, ar, who, n, p),
    win: (who, why) => { S.over = { winner: who, reason: why, turn: T.i }; ar.notes.push(why + '：' + m.players[who] + '獲勝'); },
    delayedLose: (who, n, src) => { S.delayed.push({ who, n, src }); ar.notes.push(src + '：上家下回合行動結束時扣除' + n + '點生命'); },
    resetUses: name => { S.uses[p][name] = 0; ar.notes.push('回復' + name + '使用次數'); },
    setTotem: e => { S.totem[p] = e; ar.notes.push('獲得' + TOTEMS.find(t => t.e === e).name); },
    metamorph: c => metamorph(S, m, T, ar, o, fx, c),
    chain: ch => {
      if (!ch.pouchCard) { ar.issues.push(iss('warn', '連環未登錄覆蓋為錦囊的牌')); }
      else ar.notes.push('覆蓋錦囊');
      S.pouch[p] = true;
      if (ch.trigCard && ch.strat) {
        const pc = card(ch.pouchCard || ch.trigCard), tc = card(ch.trigCard);
        if (ch.pouchCard && (pc.e === tc.e || pc.l === tc.l)) ar.issues.push(iss('error', '連環選擇的兩張牌須不同行、不同級'));
        resolveStrategy(S, m, T, ar, Object.assign({ card: ch.trigCard }, ch), '連環觸發');
      }
    },
  };
  return E;
}

/* 幻化 */
function metamorph(S, m, T, ar, o, fx, c) {
  const q = T.q;
  const lf = S.lastForm[q];
  if (!lf || lf.turn !== T.i - 1 || !lf.basic) { ar.notes.push('上家上回合沒有施展基礎規則陣法，無可複製'); return; }
  const f2 = FMAP[lf.id];
  if (!f2) { ar.notes.push('無可複製（上家陣法未知）'); return; }
  ar.notes.push('複製' + f2.id);
  if (f2.cat === 'passive') {
    if (f2.counter) S.statuses.push({ who: q, k: f2.counter, left: 1, unit: 'turn', src: '幻化' });
    return;
  }
  let pts;
  if (f2.pts) {
    let pc = c.map(x => ({ e: x.e, l: x.l }));
    if (f2.cat === 'attack' && has(S, T.p, 'qianfeng')) pc = pc.map(x => ({ e: x.e, l: Math.min(5, x.l + 1) }));
    pts = Math.ceil(f2.pts(pc, { ab: n => abOf(S, T, T.p, n), oppHand: S.hand[q], printed: pc, choice: {} }));
    ar.notes.push(f2.id + pts + '點');
  }
  const o2 = { pts, pat: {}, choice: {}, f: f2, copy: true };
  // 幻化本身是主動術式；複製攻擊時改以攻擊處理
  const fx2 = f2.cat === 'attack' ? revealOpp(S, m, T, ar, { cat: 'attack', f: f2, pts, atkType: f2.atk }) : fx;

<script>
'use strict';
const { EL, STARS, TOTEMS, FMAP, JMAP, AMAP, SPIRITS, SPIRIT_TEXT, STRATS, SMAP, card, cs, cardsText } = RULES;
const KEY = 'cfe-recorder-v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const clone = o => JSON.parse(JSON.stringify(o));

let SES = null;            // { v, players, games:[match], cur, mods, hp }
let editTurn = null;       // 正在編輯的回合索引
let sel = [];              // 已選的牌 ['金3', ...]
let hist = [], fut = [];

/* ---------- 儲存 ---------- */
function load() { try { const s = localStorage.getItem(KEY); if (s) SES = JSON.parse(s); } catch (e) { SES = null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(SES)); } catch (e) { toast('無法儲存到瀏覽器'); } }
function snap() { hist.push(JSON.stringify(SES)); if (hist.length > 60) hist.shift(); fut = []; }
function commit() { save(); render(); }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- 對局存取 ---------- */
const cur = () => SES.games[SES.cur];
function liveIdx() { return cur().turns.length - 1; }
function workIdx() { return editTurn != null ? editTurn : liveIdx(); }
function workCtx(extraAction) {
  const m = cur(), wi = workIdx();
  const m2 = Object.assign({}, m, { turns: m.turns.slice(0, wi + 1).map((t, k) => (k === wi ? { actions: t.actions.concat(extraAction ? [extraAction] : []), ended: false } : t)) });
  const r = ENGINE.replay(m2);
  const rec = r.turns[wi];
  return { S: rec.after, T: rec.ctx, rec, p: rec.p, q: 1 - rec.p, m: m2 };
}
function preview(a) {          // 預覽加入動作後的結果
  try { const c = workCtx(a); const ar = c.rec.acts[c.rec.acts.length - 1]; return ar; } catch (e) { return null; }
}
async function addAction(a) {
  const c = workCtx();
  if (['formation', 'cover', 'job', 'pass'].includes(a.kind)) {
    const ok = await maybeReveal(c);
    if (ok === false) return;
  }
  snap();
  cur().turns[workIdx()].actions.push(a);
  sel = [];
  commit();
}

/* ---------- 設定畫面 ---------- */
function renderSetup() {
  $('setup').hidden = false; $('main').hidden = true; $('tools').hidden = true;
  $('subTitle').textContent = '五行戰鬥牌 5.17';
  const ms = $('modSel'); ms.innerHTML = '';
  RULES.MODULES.forEach(md => {
    const l = document.createElement('label'); l.className = 'on';
    l.innerHTML = '<input type="checkbox" value="' + md.id + '" checked ' + (md.fixed ? 'disabled' : '') + '>' + md.name;
    l.querySelector('input').onchange = e => l.classList.toggle('on', e.target.checked);
    ms.appendChild(l);
  });
  document.querySelectorAll('.pbox .first').forEach(lb => lb.onclick = () => {});
  loadPlayers();
}
function loadPlayers() {
  fetch('players.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    const names = t.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
    $('plist').innerHTML = names.map(n => '<option value="' + esc(n) + '">').join('');
  }).catch(() => {});
}
$('bStart').onclick = () => {
  const a = $('pL').value.trim() || '左方選手', b = $('pR').value.trim() || '右方選手';
  if (a === b) return toast('兩位選手名字相同');
  const first = +document.querySelector('input[name=first]:checked').value;
  const mods = [...document.querySelectorAll('#modSel input')].filter(x => x.checked).map(x => x.value);
  const hp = Math.max(1, +$('hp0').value || 200);
  SES = { v: 1, players: [a, b], mods, hp, games: [ENGINE.newMatch([a, b], first, { mods, hp })], cur: 0 };
  hist = []; fut = []; editTurn = null; sel = [];
  commit();
};

/* ---------- 主畫面 ---------- */
function render() {
  if (!SES) return renderSetup();
  $('setup').hidden = true; $('main').hidden = false; $('tools').hidden = false;
  const m = cur();
  if (editTurn != null && editTurn >= m.turns.length) editTurn = null;
  const rep = ENGINE.replay(m);
  const c = workCtx();
  $('subTitle').textContent = SES.players[0] + ' vs ' + SES.players[1] + '　第' + (SES.cur + 1) + '局';
  renderGames();
  renderBoard(m, rep, c);
  renderEditBar(m, c);
  renderTimeline(m, rep);
  renderOps(m, c);
  $('bUndo').disabled = !hist.length; $('bRedo').disabled = !fut.length;
}

function renderGames() {
  const gs = $('gameSel');
  gs.innerHTML = SES.games.map((g, i) => {
    const o = ENGINE.replay(g).final.over;
    const w = o ? (o.winner < 0 ? '平局' : SES.players[o.winner] + '勝') : '進行中';
    return '<option value="' + i + '"' + (i === SES.cur ? ' selected' : '') + '>第' + (i + 1) + '局（' + esc(w) + '）</option>';
  }).join('');
}
$('gameSel').onchange = e => { SES.cur = +e.target.value; editTurn = null; sel = []; commit(); };

function hpClass(v, max) { const r = v / max; return r > .5 ? '' : r > .25 ? 'mid' : 'low'; }
function renderBoard(m, rep, c) {
  const S = c.S, T = c.T, p = c.p;
  const side = w => {
    const cls = 'pc ' + (w === 0 ? 'L' : 'R') + (w === p && !S.over ? ' turn' : '');
    const sp = S.spirit[w];
    let chips = '';
    if (S.shield[w]) chips += '<span class="ch sh">🛡 ' + S.shield[w] + '</span>';
    chips += '<span class="ch k"><span class="lab">職業</span>' + esc(S.job[w] || '無') + '</span>';
    const st = S.star[w];
    chips += '<span class="ch ' + (st != null ? 'e' + st : '') + '"><span class="lab">星辰</span>' + (st != null ? STARS[st].short : '無') + '<span class="stars5">' + [0, 1, 2, 3, 4].map(e => '<b class="' + (S.starHist[w].includes(e) ? 'on' : '') + '" title="' + STARS[e].name + '"></b>').join('') + '</span></span>';
    if (sp) chips += '<span class="ch ' + (EL.indexOf(sp.k) >= 0 ? 'e' + EL.indexOf(sp.k) : 'bad') + '"><span class="lab">精靈</span>' + sp.k + ' ' + sp.p + '<span class="pips">' + [1, 2, 3, 4, 5, 6].map(i => '<b class="' + (i <= sp.p ? 'on' : '') + '"></b>').join('') + '</span></span>';
    else chips += '<span class="ch"><span class="lab">精靈</span>無</span>';
    if (m.settings.mods.includes('pouch')) chips += '<span class="ch">' + (S.pouch[w] ? '<img class="mini-back" src="' + CARD_IMG['牌背'] + '"> 錦囊' : '<span class="lab">錦囊</span>無') + '</span>';
    if (S.totem[w] != null) chips += '<span class="ch e' + S.totem[w] + '">' + TOTEMS.find(t => t.e === S.totem[w]).name + '</span>';
    if (S.covered[w]) chips += '<span class="ch st">覆蓋中 ' + S.covered[w].n + '張' + (S.covered[w].form ? '（' + S.covered[w].form + '）' : '') + '</span>';
    S.statuses.filter(s => s.who === w).forEach(s => { chips += '<span class="ch ' + (['stun', 'nodraw', 'poison', 'lishan', 'guanhuo'].includes(s.k) ? 'bad' : 'st') + '">' + (ENGINE.STATUS_NAME[s.k] || s.k) + ' ' + s.left + (s.unit === 'round' ? '輪' : '') + '</span>'; });
    // 手牌
    let hand = S.hand[w];
    let handTxt = '手牌 ' + hand;
    if (w === p && c.rec.live && !S.over) {
      const nd = ENGINE.has(S, w, 'nodraw') && !T.cicada || T.noDraw;
      const n = nd ? 0 : Math.max(0, Math.min(2 + T.drawBonus, 5 - Math.max(0, hand)));
      handTxt = '手牌 ' + hand + ' → 抽' + n + ' → ' + (Math.max(0, hand) + n);
    }
    chips += '<span class="ch hand' + (hand < 0 || hand > 5 ? ' bad' : '') + '">' + handTxt + '</span>';
    return '<div class="' + cls + '"><div class="top"><div class="nm">' + esc(m.players[w]) + (m.first === w ? ' <span style="font-size:12px;color:var(--sub)">先攻</span>' : '') + '</div><div class="hp">' + S.hp[w] + '<small>/' + S.maxHp + '</small></div></div>'
      + '<div class="bar"><i class="' + hpClass(S.hp[w], S.maxHp) + '" style="width:' + (S.hp[w] / S.maxHp * 100) + '%"></i></div><div class="chips">' + chips + '</div></div>';
  };
  const o = rep.final.over;
  let center = '<div class="tn">回合<b>' + (c.rec.i + 1) + '</b></div>';
  center += '<div class="who" style="color:' + (p === 0 ? 'var(--L)' : 'var(--R)') + '">' + (p === 0 ? '◀ ' : '') + esc(m.players[p]) + (p === 1 ? ' ▶' : '') + '</div>';
  center += '<div class="env" style="' + (S.env != null ? 'background:var(--e' + S.env + 's);color:var(--e' + S.env + ')' : '') + '">' + (S.env != null ? EL[S.env] + '行環境' : '無環境') + '</div>';
  if (o) center += '<div class="over">' + esc(REPORT.resultText(m, rep)) + '</div>';
  $('board').innerHTML = side(0) + '<div class="center">' + center + '</div>' + side(1);
}

function renderEditBar(m, c) {
  const eb = $('editBar');
  if (editTurn == null) { eb.hidden = true; return; }
  eb.hidden = false;
  eb.innerHTML = '✎ 正在修改第 ' + (editTurn + 1) + ' 回合（' + esc(m.players[c.p]) + '）。上方顯示的是該回合的狀態，修改後後續回合會自動重算。<button class="btn sm" id="bDoneEdit">完成修改</button>';
  $('bDoneEdit').onclick = () => { editTurn = null; sel = []; render(); };
}

function renderTimeline(m, rep) {
  const rows = REPORT.rows(m, rep);
  let h = '<table><thead><tr><th>回合</th><th>玩家</th><th style="text-align:left">記錄</th><th>棄牌</th><th>手牌</th><th style="color:var(--L)">' + esc(m.players[0]) + '</th><th style="color:var(--R)">' + esc(m.players[1]) + '</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    const t = rep.turns[i];
    const cls = ['p' + r.p, r.level || '', r.live ? 'live' : '', editTurn === i ? 'editing' : ''].join(' ');
    let rec = '';
    if (r.active.length) rec += '<div class="pre">' + r.active.map(esc).join('<br>') + '</div>';
    if (r.action) rec += '<div class="act">' + esc(r.action) + (r.result ? ' <span class="nt">' + esc(r.result) + '</span>' : '') + '</div>';
    if (r.other.length) rec += '<div class="nt">' + r.other.map(esc).join('<br>') + '</div>';
    if (!rec) rec = r.live ? '<span class="nt">（進行中）</span>' : '<span class="nt">—</span>';
    if (r.issues.length) rec += r.issues.map(x => '<div class="iss ' + (x.level === 'warn' ? 'w' : '') + '">⚠ ' + esc(x.msg) + '</div>').join('');
    const hpc = (w) => { const prev = i ? rep.turns[i - 1].after.hp[w] : rep.initial.hp[w]; const d = t.after.hp[w] - prev; return t.after.hp[w] + (d ? '<div class="nt" style="color:' + (d < 0 ? '#b03548' : '#2e9d6a') + '">' + (d > 0 ? '+' : '') + d + '</div>' : ''); };
    h += '<tr class="' + cls + '" data-i="' + i + '"><td class="n">' + (i + 1) + '</td><td class="who">' + esc(r.player) + '</td><td>' + rec + '</td><td class="c">' + esc(r.discard) + '</td><td class="c">' + (r.hand === '' ? '' : r.hand) + '</td><td class="hp">' + hpc(0) + '</td><td class="hp">' + hpc(1) + '</td></tr>';
  });
  h += '</tbody></table>';
  const tl = $('tl');
  const atBottom = tl.scrollTop + tl.clientHeight >= tl.scrollHeight - 30;
  tl.innerHTML = h;
  tl.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => {
    const i = +tr.dataset.i;
    editTurn = (i === liveIdx() && !m.turns[i].ended) ? null : (editTurn === i ? null : i);
    sel = []; render();
  });
  if (editTurn == null && (atBottom || true)) tl.scrollTop = tl.scrollHeight;
}

/* ---------- 操作區 ---------- */
function renderOps(m, c) {
  const S = c.S, T = c.T, p = c.p;
  const w = $('opsWho'); w.textContent = m.players[p]; w.style.background = p === 0 ? 'var(--L)' : 'var(--R)';
  const over = S.over && editTurn == null && c.rec.acts.length === 0;
  // 行動前
  const o = ENGINE.options(S, m, T);
  let pre = '';
  if (m.settings.mods.includes('pouch')) pre += '<button class="pb pouch' + (o.pouch ? '' : ' off') + '" data-k="pouch"><span class="ico">🎴</span>翻開錦囊<small>' + (S.pouch[p] ? (T.pouchUsed ? '本回合已觸發' : '選牌與秘計') : '目前沒有錦囊') + '</small></button>';
  if (m.settings.mods.includes('retrieve') && o.retrieve) pre += '<button class="pb rt" data-k="retrieve"><span class="ico">♻</span>棄牌回收 ' + o.retrieve + '<small>扣除' + (card(o.retrieve).l * 2) + '點生命' + (ENGINE.abOf(S, T, p, '尋道術') ? '（尋道術減半）' : '') + '</small></button>';
  o.abilities.forEach(a => { pre += '<button class="pb ab' + (a.ok ? '' : ' off') + '" data-k="ability" data-id="' + a.id + '"><span class="ico">✦</span>' + a.id + '<small>' + esc(AMAP[a.id].text) + '</small></button>'; });
  o.spirit.forEach(s => { pre += '<button class="pb sp' + (s.ok ? '' : ' off') + '" data-k="spirit" data-id="' + s.id + '"><span class="ico">✿</span>' + s.id + '（' + s.cost + '）<small>' + esc(s.ok ? (SPIRIT_TEXT[s.id] || '') : (ENGINE.has(S, p, 'lishan') ? '離山中，精靈技能無效' : S.spirit[p] && S.spirit[p].p < s.cost ? '靈力不足' : '本回合已使用精靈技能')) + '</small></button>'; });
  if (!pre) pre = '<div class="empty">目前沒有可用的行動前效果</div>';
  $('pre').innerHTML = pre;
  $('pre').querySelectorAll('.pb').forEach(b => b.onclick = () => onPre(b.dataset.k, b.dataset.id));
  // 上家覆蓋待補登
  const cv = S.covered[c.q];
  const rb = $('revealBox');
  rb.innerHTML = cv && !cv.form ? '<div class="revealbox">上家覆蓋了 ' + cv.n + ' 張被動術式，行動時翻開<button class="btn sm soft" id="bRev">先補登</button></div>' : '';
  if ($('bRev')) $('bRev').onclick = () => doReveal(c, true);
  // 本回合動作
  const acts = c.rec.acts;
  $('acts').innerHTML = acts.length ? acts.map((ar, i) => {
    const lv = ar.issues.some(x => x.level === 'error') ? 'error' : ar.issues.some(x => x.level === 'warn') ? 'warn' : '';
    return '<li class="' + lv + '"><b>' + esc(ar.text) + '</b>' + (ar.notes.length ? '<div class="nt">' + esc(ar.notes.join('；')) + '</div>' : '')
      + ar.issues.map(x => '<div class="iss ' + (x.level === 'warn' ? 'w' : '') + '">⚠ ' + esc(x.msg) + '</div>').join('') + '<button class="x" data-i="' + i + '" title="刪除">✕</button></li>';
  }).join('') : '<li style="border-style:dashed;color:#a3b3c3">尚無動作</li>';
  $('acts').querySelectorAll('.x').forEach(b => b.onclick = e => { e.stopPropagation(); delAction(+b.dataset.i); });
  renderGrid();
  renderTray();
  renderCands(m, c);
  $('bEnd').hidden = editTurn != null;
  $('bEnd').textContent = S.over ? '結束本回合（對局已分勝負）' : '結束回合 ▶';
  $('bEnd').disabled = !!(cur().turns[liveIdx()].ended);
}
function delAction(i) {
  snap();
  cur().turns[workIdx()].actions.splice(i, 1);
  commit();
}

function cardBtn(k, extra) {
  return '<button class="cd" data-c="' + k + '"><img src="' + CARD_IMG[k] + '" alt="' + k + '">' + (extra || '') + '</button>';
}
function gridHTML(counts) {
  let h = '';
  EL.forEach((e, ei) => {
    h += '<div class="el" style="color:var(--e' + ei + ')">' + e + '</div>';
    for (let l = 1; l <= 5; l++) { const k = e + l; const n = counts[k] || 0; h += cardBtn(k, n ? '<span class="cnt">' + n + '</span>' : '').replace('class="cd"', 'class="cd' + (n ? ' on' : '') + '"'); }
  });
  return h;
}
function counts(arr) { const o = {}; arr.forEach(k => { o[k] = (o[k] || 0) + 1; }); return o; }
function renderGrid() {
  const g = $('grid');
  g.innerHTML = gridHTML(counts(sel));
  g.querySelectorAll('.cd').forEach(b => b.onclick = () => { if (sel.length >= 6) return toast('最多選 6 張'); sel.push(b.dataset.c); renderGrid(); renderTray(); renderCands(cur(), workCtx()); });
}
function renderTray() {
  const t = $('tray');
  t.innerHTML = sel.length ? sel.map((k, i) => '<span class="tc e' + card(k).e + 'c" data-i="' + i + '">' + k + ' ✕</span>').join('') + '<button class="clr" id="bClr">清除</button>' : '<span class="hint">點選上方的牌，下方會列出可構成的陣法與轉職</span>';
  t.querySelectorAll('.tc').forEach(x => x.onclick = () => { sel.splice(+x.dataset.i, 1); renderGrid(); renderTray(); renderCands(cur(), workCtx()); });
  if ($('bClr')) $('bClr').onclick = () => { sel = []; renderGrid(); renderTray(); renderCands(cur(), workCtx()); };
}
function renderCands(m, c) {
  const box = $('cands');
  const S = c.S, T = c.T, p = c.p;
  if (!sel.length) {
    box.innerHTML = '<div class="empty">先在左邊選牌。被動術式若看不到內容，可以直接按下方按鈕只記張數。</div>'
      + '<button class="cb cov" id="bCovUnknown"><div class="t">覆蓋被動術式（不知道內容）</div><div class="d">只記張數，翻開時再補登</div></button>';
    $('bCovUnknown').onclick = async () => { const n = await pickOption({ title: '覆蓋了幾張牌？', row: true, options: [2, 3, 4, 5].map(v => ({ v, label: v + ' 張' })) }); if (n) addAction({ kind: 'cover', n }); };
    return;
  }
  const X = ENGINE.ctxX(S, m, T, p, {});
  const fs = RULES.recognize(sel, X);
  const js = RULES.recognizeJobs(sel, X);
  let h = '';
  fs.forEach((r, i) => {
    if (r.f.cat === 'passive') {
      h += '<button class="cb cov' + (r.legal ? '' : ' bad') + '" data-f="' + i + '"><div class="t">覆蓋：' + r.f.id + '<span class="tag">被動術式</span></div><div class="d">' + esc(r.legal ? (r.notes.join('、') || '已知內容的覆蓋') : r.reasons.join('、')) + '</div></button>';
      return;
    }
    const pv = preview({ kind: 'formation', form: r.f.id, cards: sel.slice(), pi: r.pi, via: r.notes.join(',') });
    const pts = pv && /(\d+)點$/.test(pv.text) ? pv.text.match(/(\d+)點$/)[1] + '點' : '';
    const d = r.legal ? (pv ? pv.notes.filter(n => !/^翻開/.test(n)).join('；') : '') : r.reasons.join('、');
    h += '<button class="cb' + (r.legal ? '' : ' bad') + '" data-f="' + i + '"><div class="t">' + r.f.id + ' <span class="pts">' + pts + '</span><span class="tag">' + catName(r.f) + (r.notes.length ? '・' + esc(r.notes.join('、')) : '') + '</span></div><div class="d">' + esc(d) + '</div></button>';
  });
  js.forEach((r, i) => {
    h += '<button class="cb job' + (r.legal ? '' : ' bad') + '" data-j="' + i + '"><div class="t">轉職 ' + r.job.id + '<span class="tag">' + (r.path ? r.path + '・' : '') + esc(r.job.costText) + '</span></div><div class="d">' + esc(r.legal ? (r.job.prereq && Array.isArray(r.job.prereq) ? '目前為' + (S.job[p] || '') : '') : r.reasons.join('、')) + '</div></button>';
  });
  // 不符條件的選項收進摺疊區，避免干擾
  const tmp = document.createElement('div'); tmp.innerHTML = h;
  const bad = [...tmp.querySelectorAll('.cb.bad')];
  if (bad.length && bad.length < tmp.children.length) {
    const det = document.createElement('details'); det.className = 'badlist';
    det.innerHTML = '<summary>其他不符條件的選項（' + bad.length + '）</summary>';
    bad.forEach(b => det.appendChild(b)); tmp.appendChild(det);
    h = tmp.innerHTML;
  }
  h += '<button class="cb cov" id="bCovSel"><div class="t">覆蓋被動術式（' + sel.length + '張，不指明）</div><div class="d">翻開時再補登是什麼</div></button>';
  if (!fs.length && !js.length) h = '<div class="empty">這組牌目前無法構成任何陣法或轉職。</div>' + h;
  box.innerHTML = h;
  box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => onFormation(fs[+b.dataset.f]));
  box.querySelectorAll('[data-j]').forEach(b => b.onclick = () => addAction({ kind: 'job', job: js[+b.dataset.j].job.id, cards: sel.slice() }));
  $('bCovSel').onclick = () => addAction({ kind: 'cover', cards: sel.slice() });
}
function catName(f) { return f.cat === 'attack' ? (f.atk === 'P' ? '物理攻擊' : f.atk === 'S' ? '特殊攻擊' : f.atk === 'choice' ? '攻擊' : EL[f.atk] + '行攻擊') : f.cat === 'active' ? '主動術式' : '被動術式'; }

async function onFormation(r) {
  const c = workCtx();
  const a = { kind: 'formation', form: r.f.id, cards: sel.slice(), pi: r.pi, via: r.notes.join(',') };
  if (r.f.cat === 'passive') return addAction({ kind: 'cover', cards: sel.slice(), form: r.f.id });
  const choice = {};
  if (r.f.choice) {
    const X = ENGINE.ctxX(c.S, cur(), c.T, c.p, {});
    const ch = r.f.choice(r.cards, X);
    if (ch) { const v = await pickOption({ title: ch.title, options: ch.options, row: ch.options.length <= 6 }); if (v == null) return; choice[ch.key] = v; }
  }
  const VIEW = ['光芒', '混沌', '萬鳴', '鏡鳴', '聖風', '北靈陣‧玄甲', '中靈陣‧黃鱗'];
  if (VIEW.includes(r.f.id) && c.S.spirit[c.p] && c.S.spirit[c.p].k === '惡') {
    const v = await pickOption({ title: '戲鬧：檢視到的手牌最高等級？', row: true, options: [1, 2, 3, 4, 5].map(v => ({ v, label: v + '級' })), skip: '不知道' });
    if (v) choice.viewMax = v;
  }
  if (r.f.id === '連環') {
    const ch = await chainFlow(c);
    if (!ch) return;
    Object.assign(choice, ch);
  }
  if (Object.keys(choice).length) a.choice = choice;
  addAction(a);
}

/* ---------- 行動前效果 ---------- */
async function onPre(k, id) {
  const c = workCtx();
  if (k === 'retrieve') return addAction({ kind: 'retrieve' });
  if (k === 'pouch') {
    const cd = await pickCards({ title: '錦囊牌是哪一張？', n: 1 });
    if (!cd) return;
    const a = await strategyFlow(c, cd[0]);
    if (!a) return;
    return addAction(Object.assign({ kind: 'pouch', card: cd[0] }, a));
  }
  if (k === 'ability') {
    const def = AMAP[id]; const a = { kind: 'ability', id };
    for (const inp of def.inputs) {
      if (inp === 'discard2') { const cc = await pickCards({ title: id + '：捨棄的兩張牌（可略過）', n: 2, skip: true }); if (cc === null) return; if (cc.length) a.cards = cc; }
      if (inp === 'virtual') { const v = await pickCards({ title: id + '：產生哪一張牌？', n: 1 }); if (!v) return; a.virtual = v[0]; }
      if (inp === 'card') { const v = await pickCards({ title: id + '：' + cardPrompt(def), n: 1, skip: id === '影切' ? false : true }); if (v === null) return; if (v.length) a.card = v[0]; }
      if (inp === 'level12') { const v = await pickOption({ title: '降為幾級？', row: true, options: [{ v: 1, label: '1級' }, { v: 2, label: '2級' }] }); if (!v) return; a.level = v; }
    }
    return addAction(a);
  }
  if (k === 'spirit') {
    const sp = c.S.spirit[c.p]; const sk = SPIRITS[sp.k].skills.find(s => s.id === id);
    const a = { kind: 'spirit', id };
    for (const inp of sk.inputs || []) {
      if (inp === 'card') { const v = await pickCards({ title: id + '：指定哪一張牌？', n: 1, skip: id === '川流' }); if (v === null) return; if (v.length) a.card = v[0]; }
      if (inp === 'level') { const v = await pickOption({ title: '絢爛：視為幾級？', row: true, options: [1, 2, 3, 4, 5].map(v => ({ v, label: v + '級' })) }); if (!v) return; a.level = v; }
      if (inp === 'maxLevel') { const v = await pickOption({ title: '戲鬧：檢視到的最高等級？', row: true, options: [1, 2, 3, 4, 5].map(v => ({ v, label: v + '級' })), skip: '不知道' }); if (v) a.maxLv = v; }
      if (inp === 'cards4') { const v = await pickCards({ title: '死兆：捨棄的牌（最多四張）', n: 4, min: 1 }); if (!v) return; a.cards = v; }
    }
    return addAction(a);
  }
}
function cardPrompt(def) {
  return { l4: '捨棄哪一張４級以上的牌？', woodfire: '哪一張木或火行牌？', woodwater: '捨棄哪一張木或水？', fireStar: '捨棄哪一張火或星行牌？', aboveRes: '捨棄哪一張牌？' }[def.cardRule] || '哪一張牌？';
}
async function strategyFlow(c, cd) {
  const ss = RULES.stratsFor(card(cd));
  const sid = await pickOption({ title: '錦囊 ' + cd + '：選擇秘計', options: ss.map(s => ({ v: s.id, label: '秘計‧' + s.id, sub: s.text })) });
  if (!sid) return null;
  const a = { strat: sid };
  if (sid === '離山') {
    const t = await pickOption({ title: '離山：指定哪位玩家？', row: true, options: [0, 1].map(w => ({ v: String(w), label: SES.players[w] })) });
    if (t == null) return null; a.target = +t;
  }
  if (sid === '瞞天') {
    const op = await pickOption({ title: '瞞天：選擇效果', options: [{ v: 'break', label: '破除指定星辰' }, { v: 'gain', label: '本回合獲得指定屬性星辰效果' }] });
    if (!op) return null;
    const exist = [0, 1].map(w => c.S.star[w]).filter(x => x != null);
    const list = op === 'break' ? exist : [0, 1, 2, 3, 4];
    if (!list.length) { toast('場上沒有星辰'); return null; }
    const e = await pickOption({ title: op === 'break' ? '破除哪個星辰？' : '獲得哪個星辰的效果？', options: list.map(e => ({ v: String(e), label: STARS[e].name })) });
    if (e == null) return null; a.starOp = { op, e: +e };
  }
  if (sid === '走為') {
    const op = await pickOption({ title: '走為：選擇效果', options: [{ v: 'clear', label: '破除目前環境' }, { v: 'transfer', label: '捨棄一張牌並轉換為該牌屬性環境' }] });
    if (!op) return null;
    a.envOp = { op };
    if (op === 'transfer') { const v = await pickCards({ title: '捨棄哪一張牌？', n: 1 }); if (!v) return null; a.envOp.card = v[0]; }
  }
  if (sid === '牽羊') { const v = await pickCards({ title: '牽羊：從棄牌堆放回的牌（可略過）', n: 2, skip: true }); if (v === null) return null; if (v.length) a.cards = v; }
  return a;
}
async function chainFlow(c) {
  const pc = await pickCards({ title: '連環：覆蓋為錦囊的牌（可略過）', n: 1, skip: true });
  if (pc === null) return null;
  const tc = await pickCards({ title: '連環：觸發秘計的牌（可略過）', n: 1, skip: true });
  if (tc === null) return null;
  const ch = { pouchCard: pc[0] || null };
  if (tc.length) { const s = await strategyFlow(c, tc[0]); if (!s) return null; Object.assign(ch, s, { trigCard: tc[0] }); }
  return ch;
}

/* ---------- 翻開被動術式 ---------- */
async function maybeReveal(c) {
  const cv = c.S.covered[c.q];
  if (!cv || cv.form) return true;
  return doReveal(c, false);
}
async function doReveal(c, explicit) {
  const cv = c.S.covered[c.q];
  const res = await pickCards({ title: '翻開上家覆蓋的被動術式（' + cv.n + '張）', sub: '選出翻開的牌；不清楚可略過，之後再點該回合補登', n: cv.n, min: 1, skip: true });
  if (res === null) return explicit ? false : false;
  if (!res.length) return true;
  // 用覆蓋當下的狀態辨識
  const m = cur();
  const ti = cv.ti;
  const t = m.turns[ti];
  const ai = t.actions.findIndex(a => a.kind === 'cover');
  const m2 = Object.assign({}, m, { turns: m.turns.slice(0, ti + 1).map((x, k) => (k === ti ? { actions: x.actions.slice(0, ai), ended: false } : x)) });
  const rr = ENGINE.replay(m2).turns[ti];
  const X = ENGINE.ctxX(rr.after, m2, rr.ctx, rr.p, {});
  const ps = RULES.recognizePassive(res, X);
  let form;
  if (!ps.length) form = await pickOption({ title: '這些牌構成哪一種被動術式？', options: ['防禦', '封印', '反震', '空城', '毒煙'].map(v => ({ v, label: v })) });
  else if (ps.length === 1) form = ps[0].f.id;
  else form = await pickOption({ title: '這些牌構成哪一種被動術式？', options: ps.map(r => ({ v: r.f.id, label: r.f.id, sub: r.legal ? r.notes.join('、') : r.reasons.join('、') })) });
  if (!form) return false;
  snap();
  Object.assign(t.actions[ai], { cards: res, form });
  save();
  if (explicit) render();
  return true;
}

$('bEnd').onclick = async () => {
  const m = cur(); const i = liveIdx();
  const c = workCtx();
  const warn = [];
  if (!c.T.actionDone && !c.S.over) warn.push('本回合還沒有登錄行動');
  if (!c.T.discarded && !c.T.discardNone && !c.S.over) {
    const nd = (ENGINE.has(c.S, c.p, 'nodraw') && !c.T.cicada) || c.T.noDraw;
    const n = nd ? 0 : Math.min(2 + c.T.drawBonus, 5 - Math.max(0, c.S.hand[c.p]));
    if (n > 0) warn.push('本回合還沒有登錄棄牌');
  }
  if (warn.length) { const ok = await confirm2('確定結束回合？', warn.join('、') + '。結束後仍可點選該回合修改。'); if (!ok) return; }
  snap();
  m.turns[i].ended = true;
  const rep = ENGINE.replay(m);
  if (!rep.final.over) m.turns.push({ actions: [], ended: false });
  else toast('對局結束：' + REPORT.resultText(m, rep));
  sel = [];
  commit();
};

async function adjustDialog() {
  const c = workCtx();
  const m = cur();
  const body = document.createElement('div');
  body.innerHTML = '<div class="frm"><label>對象</label><select id="ajW">' + [0, 1].map(w => '<option value="' + w + '"' + (w === c.p ? ' selected' : '') + '>' + esc(m.players[w]) + '</option>').join('') + '</select>'
    + '<label>項目</label><select id="ajF"><option value="hp">生命值</option><option value="shield">防護罩</option><option value="hand">手牌數</option><option value="power">精靈靈力</option><option value="spirit">精靈</option><option value="job">職業</option><option value="star">星辰</option><option value="env">環境</option><option value="pouch">錦囊</option><option value="totem">圖騰</option><option value="status">加上狀態</option><option value="unstatus">移除狀態</option></select>'
    + '<label>數值</label><div id="ajV"></div><label>說明</label><input id="ajN" placeholder="選填，例如：舊規則效果"></div>';
  const vbox = () => body.querySelector('#ajV');
  const fill = () => {
    const f = body.querySelector('#ajF').value; const w = +body.querySelector('#ajW').value;
    const S = c.S; let h = '';
    if (['hp', 'shield', 'hand', 'power'].includes(f)) {
      const curv = f === 'hp' ? S.hp[w] : f === 'shield' ? S.shield[w] : f === 'hand' ? S.hand[w] : (S.spirit[w] ? S.spirit[w].p : 0);
      h = '<div style="display:flex;gap:6px"><select id="ajM" style="width:110px"><option value="set">改為</option><option value="add">增減</option></select><input id="ajX" type="number" value="' + curv + '"></div>';
    } else if (f === 'job') h = '<select id="ajX"><option value="">無職業</option>' + RULES.JOBS.map(j => '<option' + (S.job[w] === j.id ? ' selected' : '') + '>' + j.id + '</option>').join('') + '</select>';
    else if (f === 'spirit') h = '<select id="ajX"><option value="">無精靈</option>' + Object.keys(SPIRITS).map(k => '<option value="' + k + '">' + k + '精靈</option>').join('') + '</select>';
    else if (f === 'star') h = '<select id="ajX"><option value="">無星辰</option>' + STARS.map(s => '<option value="' + s.e + '"' + (S.star[w] === s.e ? ' selected' : '') + '>' + s.name + '</option>').join('') + '</select>';
    else if (f === 'env') h = '<select id="ajX"><option value="">無環境</option>' + EL.map((e, i) => '<option value="' + i + '"' + (S.env === i ? ' selected' : '') + '>' + e + '行環境</option>').join('') + '</select>';
    else if (f === 'pouch') h = '<select id="ajX"><option value="1">有錦囊</option><option value="">無錦囊</option></select>';
    else if (f === 'totem') h = '<select id="ajX"><option value="">無圖騰</option>' + TOTEMS.map(t => '<option value="' + t.e + '">' + t.name + '</option>').join('') + '</select>';
    else if (f === 'status' || f === 'unstatus') h = '<div style="display:flex;gap:6px"><select id="ajX">' + Object.keys(ENGINE.STATUS_NAME).map(k => '<option value="' + k + '">' + ENGINE.STATUS_NAME[k] + '</option>').join('') + '</select>' + (f === 'status' ? '<input id="ajL" type="number" value="1" min="1" style="width:80px" title="回合數">' : '') + '</div>';
    vbox().innerHTML = h;
  };
  body.querySelector('#ajF').onchange = fill; body.querySelector('#ajW').onchange = fill; fill();
  const ok = await modal({ title: '手動調整', sub: '用於規則引擎沒有涵蓋的情況，該回合會標黃提醒', body, buttons: [{ v: false, label: '取消', cls: 'ghost' }, { v: true, label: '加入', cls: '' }] });
  if (!ok) return;

  if (f === 'status') { a.left = +body.querySelector('#ajL').value || 1; }
  if (f === 'unstatus') a.mode = 'remove';
  if (f === 'pouch') a.value = !!x.value;
