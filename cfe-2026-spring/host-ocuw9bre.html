@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --bg:#eef5fb; --card:#ffffff; --ink:#1f2d3d; --sub:#6b7f95; --line:#d6e4f0;
  --pri:#2f74c0; --pri-soft:#e3f0fb; --pri-deep:#1d4f8a;
  --win:#2f74c0; --loss:#d0576b; --draw:#c99a2e;
  --win-bg:#e6f1fc; --loss-bg:#fbecef; --draw-bg:#fbf4e3;
  --gold:#d4a017;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;margin:0;padding:12px;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.container{max-width:1280px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(31,79,138,.10);overflow:hidden}
header{background:linear-gradient(135deg,#2f6db5 0%,#4c9bd8 55%,#7cc6ea 100%);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:260px}
.brand img{width:64px;height:64px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.7)}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:1px}
.brand .sub{font-size:15px;opacity:.9}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.45);padding:9px 16px;border-radius:9999px;font-size:16px;font-weight:600;cursor:pointer}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.due{background:#ffd75e;color:#5a3d00;border-color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,94,.9)}50%{box-shadow:0 0 0 8px rgba(255,215,94,0)}}
.qt th .ok{color:#2e9d6a;margin-left:4px}
nav.tabs{display:flex;gap:6px;padding:12px 16px 0;background:#f4f9fd;border-bottom:1px solid var(--line)}
.tab{flex:1;max-width:240px;padding:14px 10px;font-size:20px;font-weight:700;border:none;border-radius:14px 14px 0 0;background:transparent;color:var(--sub);cursor:pointer}
.tab.active{background:#fff;color:var(--pri-deep);box-shadow:0 -2px 0 var(--pri) inset}
.tab:disabled{color:#b9c6d3;cursor:default}
.page{display:none;padding:18px 18px 24px}
.page.active{display:block}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 12px;font-size:20px;color:var(--pri-deep);display:flex;align-items:center;gap:10px}
.badge{display:inline-block;background:var(--pri-soft);color:var(--pri-deep);border-radius:9999px;padding:2px 12px;font-size:15px;font-weight:700}
.badge.lock{background:#1d4f8a;color:#fff}
textarea{width:100%;min-height:420px;font-family:inherit;font-size:20px;line-height:1.6;padding:12px 14px;border:2px solid var(--line);border-radius:14px;resize:vertical;color:var(--ink);background:#fbfdff}
textarea:focus{outline:none;border-color:var(--pri)}
textarea[readonly]{background:#f2f5f8;color:#5d6e80}
.btn{border:none;padding:14px 22px;border-radius:9999px;font-weight:700;font-size:18px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(47,116,192,.25)}
.btn.soft{background:var(--pri-soft);color:var(--pri-deep);box-shadow:none}
.btn.ghost{background:#fff;color:var(--pri-deep);border:2px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#e2b33b,#cf8f17);box-shadow:0 3px 10px rgba(207,143,23,.3)}
.btn:disabled{background:#c9d4df;color:#fff;box-shadow:none;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns.center{justify-content:center}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);text-align:center;padding:8px 6px}
th{background:#f1f7fc;color:var(--pri-deep);font-size:16px;font-weight:700}
/* schedule */
.sched td{font-size:19px;padding:10px 8px}
.sched td.tno{background:#f7fbfe;color:var(--sub);font-size:16px;font-weight:700;white-space:nowrap}
.sched .vs{color:#9fb3c8;font-size:14px;margin:0 2px}
.sched .p{font-weight:700;white-space:nowrap}
.sched .bye{color:var(--sub)}
/* qualifier */
.qt{min-width:1080px}
.qt td.name{font-size:22px;font-weight:700;text-align:left;padding-left:14px;white-space:nowrap}
.qt td.rc{cursor:pointer;min-width:96px;padding:6px 4px;user-select:none;-webkit-user-select:none}
.qt td.rc:active{background:#fffbe6}
.qt td.rc.locked{cursor:default}
.mk{font-size:30px;font-weight:700;letter-spacing:4px;line-height:1.15;white-space:nowrap}
.mk .W{color:var(--win)} .mk .L{color:var(--loss)} .mk .D{color:var(--draw)} .mk .N{color:#cdd8e3}
.opp{font-size:14px;color:var(--sub);white-space:nowrap}
.qt td.num{font-size:21px;font-weight:600;min-width:62px}
.qt td.total{font-size:26px;font-weight:800;color:var(--pri-deep);background:#f1f7fd;min-width:80px}
.qt td.rank{font-size:24px;font-weight:800;min-width:60px}
.qt tr.adv td{background:#e9f4fd}
.qt tr.adv td.total{background:#d8eafa}
.adv-tag{display:inline-block;background:var(--pri);color:#fff;border-radius:9999px;padding:3px 14px;font-size:17px;font-weight:700}
.byecell{font-size:20px;color:var(--sub);font-weight:700}
.status{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.status .prog{font-size:18px;color:var(--sub);font-weight:600}
.tie{margin-top:16px}
.tie .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px dashed var(--line)}
.tie .grp:first-of-type{border-top:none}
.tie .pts{font-size:20px;font-weight:800;color:var(--pri-deep);min-width:90px}
.chip{border:2px solid var(--line);background:#fff;border-radius:9999px;padding:10px 18px;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink);position:relative}
.chip.on{border-color:var(--pri);background:var(--pri-soft)}
.chip .ord{display:inline-block;background:var(--pri);color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;font-size:15px;margin-right:6px;text-align:center}
.chip:disabled{cursor:default}
/* finals */
.seedsel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:21px}
.seedsel .me{font-weight:800;color:var(--pri-deep)}
.ft{max-width:880px;margin-bottom:6px}
.ft td{font-size:20px}
.ft td.grp{font-weight:700;color:var(--sub);font-size:16px;background:#f7fbfe;width:84px}
.ft td.name{font-weight:700;text-align:left;padding-left:14px;font-size:22px;white-space:nowrap}
.ft td.g{cursor:pointer;width:92px;font-size:32px;font-weight:800;user-select:none;-webkit-user-select:none}
.ft td.g.W{color:var(--win)} .ft td.g.L{color:var(--loss)} .ft td.g.D{color:var(--draw)}
.ft td.g.off{cursor:default;background:#f6f8fa}
.ft td.g.next{background:#fffdf3}
.ft td.res{width:110px}
.ft .tbd{color:#a9b8c7;font-weight:500}
.restag{display:inline-block;border-radius:9999px;padding:3px 14px;font-size:17px;font-weight:700;background:var(--pri);color:#fff}
.restag.c1{background:linear-gradient(135deg,#e7b93d,#c98a10)}
.restag.c2{background:#8fa3b8}
.restag.c3{background:#b9824f}
.restag.c4{background:#a7b6c4}
.sec-title{font-size:21px;font-weight:800;color:var(--pri-deep);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.podium{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:880px;margin-top:20px}
.pod{border-radius:16px;padding:14px;text-align:center;background:#f4f9fd;border:1px solid var(--line)}
.pod .t{font-size:16px;font-weight:700;color:var(--sub)}
.pod .n{font-size:26px;font-weight:800;color:var(--ink);margin-top:2px}
.pod.p1{background:linear-gradient(160deg,#fff7df,#fde7a6);border-color:#f0d27a}
.pod.p1 .n{font-size:30px}
/* capture header */
.caphead{display:none;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.caphead img{width:56px;height:56px;border-radius:12px}
.caphead .ct{font-size:24px;font-weight:800;color:var(--pri-deep)}
.caphead .cs{font-size:15px;color:var(--sub)}
.capturing .caphead{display:flex}
.capturing .nocap{display:none!important}
.capturing .tw{overflow:visible!important}
footer{text-align:center;color:#8aa0b6;font-size:13px;padding:10px 0 16px}
/* popup */
.pop-wrap{position:fixed;inset:0;background:rgba(15,40,70,.55);display:flex;align-items:center;justify-content:center;z-index:1500;animation:fadeIn .15s ease}
.pop{background:#fff;width:94%;max-width:560px;border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,.35);overflow:hidden}
.pop .hd{padding:20px 22px 6px;text-align:center}
.pop .hd .r{font-size:16px;color:var(--sub);font-weight:700}
.pop .hd .m{font-size:24px;font-weight:800;margin-top:4px}
.pop .hd .m .vs{color:#9fb3c8;font-size:17px;margin:0 8px}
.pop .bd{padding:10px 22px 18px}
.gline{display:flex;align-items:center;gap:8px;margin:10px 0}
.gline .gl{width:64px;font-size:17px;font-weight:700;color:var(--sub)}
.opt{flex:1;padding:16px 6px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt.on.a{background:var(--win-bg);border-color:var(--win);color:var(--win)}
.opt.on.d{background:var(--draw-bg);border-color:var(--draw);color:#9a7417}
.opt.on.b{background:var(--loss-bg);border-color:var(--loss);color:var(--loss)}
.pop .ft2{background:#f8f9fa;padding:16px;display:flex;gap:10px}
.pop .ft2 button{flex:1;padding:14px;border:none;border-radius:9999px;font-weight:700;font-size:17px;cursor:pointer}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (max-width:820px){.brand h1{font-size:21px}.tab{font-size:17px}textarea{min-height:260px}}
</style>
</head>

const PLAYER_TXT = 'players.txt';

/* ---------- state ---------- */
function blank(){
  return {v:1, roster:'', players:[], rounds:null, schedLocked:false,
    res:null, tie:{}, top4:null, semiOpp:null, semiLocked:false,
    fin:{semi:[[],[]], champ:{pair:null,g:[]}, third:{pair:null,g:[]}}, savedAt:null};
}
let S = load() || blank();
let undo = [];
let backed = [];   // 已備份的里程碑（不跟著復原變動）
try{ backed = JSON.parse(localStorage.getItem(KEY+'-backed')) || []; }catch(e){ backed = []; }
function saveBacked(){ try{ localStorage.setItem(KEY+'-backed', JSON.stringify(backed)); }catch(e){} }
try{ undo = JSON.parse(localStorage.getItem(KEY+'-undo')) || []; }catch(e){ undo = []; }

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.v===1 ? s : null; }catch(e){ return null; } }
function save(){
  S.savedAt = Date.now();
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    localStorage.setItem(KEY+'-undo', JSON.stringify(undo.slice(-40)));
  }catch(e){}
}
function commit(fn){
  undo.push(JSON.stringify(S)); if(undo.length>40) undo.shift();
  fn(); save(); render();
}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm = i => i<0 ? '' : esc(S.players[i] ?? '?');
const inv = r => r==='W'?'L':r==='L'?'W':r;
const MARK = {W:'○', L:'╳', D:'△'};
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function stamp(d=new Date()){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }

function showModal(title, message, type='info', confirmText='確定', cancelText=null, onConfirm=null){
  const old = document.getElementById('customModal'); if(old) old.remove();
  const modal = document.createElement('div');
  modal.id='customModal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:2000;animation:fadeIn 0.2s ease;';
  const box = document.createElement('div');
  box.style.cssText='background:white;width:92%;max-width:420px;border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,0.4);overflow:hidden;';
  box.innerHTML = `
    <div style="padding:28px 24px 20px;text-align:center;">
      <div style="font-size:52px;margin-bottom:16px;">${type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️'}</div>
      <h3 style="margin:0 0 16px;font-size:22px;color:#222;">${title}</h3>
      <p style="margin:0;color:#555;line-height:1.6;font-size:17px;">${message}</p>
    </div>
    <div style="background:#f8f9fa;padding:18px;display:flex;gap:12px;justify-content:center;">
      ${cancelText?`<button id="modalCancel" style="flex:1;padding:14px;border:none;border-radius:9999px;background:#ccc;font-weight:600;font-size:17px;cursor:pointer;">${cancelText}</button>`:''}
      <button id="modalConfirm" style="flex:1;padding:14px;border:none;border-radius:9999px;background:${type==='error'?'#d32f2f':'#2f74c0'};color:white;font-weight:600;font-size:17px;cursor:pointer;">${confirmText}</button>
    </div>`;
  modal.appendChild(box); document.body.appendChild(modal);
  document.getElementById('modalConfirm').onclick=()=>{ modal.remove(); if(onConfirm) onConfirm(); };
  const c=document.getElementById('modalCancel'); if(c) c.onclick=()=>modal.remove();
}
const ask = (title,msg,fn,ok='確定') => showModal(title,msg,'warning',ok,'取消',fn);

/* ---------- roster ---------- */
function parseRoster(t){ return t.split(/\r?\n/).map(s=>s.replace(/^\s*\d+[.、)\s]+/,'').trim()).filter(s=>s && !s.startsWith('#')); }
async function loadTxt(silent){
  try{
    const r = await fetch(PLAYER_TXT+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const names = parseRoster(await r.text());
    if(!names.length) throw 0;
    const apply = () => { S.roster = names.join('\n'); save(); render(); };
    if(silent) apply();
    else if(S.roster.trim()) ask('讀取名單檔', `以 ${PLAYER_TXT}（${names.length} 人）取代目前名單？`, ()=>commit(()=>{ S.roster = names.join('\n'); }), '取代');
    else commit(()=>{ S.roster = names.join('\n'); });
  }catch(e){ if(!silent) showModal('讀取失敗', `找不到 ${PLAYER_TXT}`, 'error'); }
}

/* ---------- pairing ---------- */
// Build ROUNDS perfect matchings with no repeated pair; odd n gets a dummy (-1 = 輪空).
function tryRounds(n){
  const ids = [...Array(n).keys()]; if(n%2) ids.push(-1);
  const used = new Set(); const k=(a,b)=>a<b?a+','+b:b+','+a;
  const rounds=[];
  for(let r=0;r<ROUNDS;r++){
    const order = shuffle(ids.slice()); const taken=new Set(); const pairs=[];
    let steps=0;
    const rec = () => {
      if(++steps>4000) return false;
      const a = order.find(x=>!taken.has(x)); if(a===undefined) return true;
      taken.add(a);
      for(const b of shuffle(order.filter(x=>!taken.has(x)))){
        if(used.has(k(a,b))) continue;
        taken.add(b); pairs.push([a,b]);
        if(rec()) return true;
        taken.delete(b); pairs.pop();
      }
      taken.delete(a); return false;
    };
    if(!rec()) return null;
    pairs.forEach(([a,b])=>used.add(k(a,b)));
    rounds.push(pairs.map(([a,b])=> a<0?[b,-1] : b<0?[a,-1] : [a,b]));
  }
  return rounds;
}
// Fiedler value (algebraic connectivity) via Jacobi: higher = harder to split into cliques.
function fiedler(n, rounds){
  const L = Array.from({length:n},()=>new Float64Array(n));
  rounds.forEach(rd=>rd.forEach(([a,b])=>{ if(b<0) return; L[a][b]-=1; L[b][a]-=1; L[a][a]+=1; L[b][b]+=1; }));
  const A = L.map(r=>Array.from(r));
  for(let sw=0;sw<60;sw++){
    let off=0; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) off+=A[i][j]*A[i][j];
    if(off<1e-10) break;
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++){
      if(Math.abs(A[p][q])<1e-12) continue;
      const th=(A[q][q]-A[p][p])/(2*A[p][q]);
      const t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1));
      const c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<n;k++){ const akp=A[k][p], akq=A[k][q]; A[k][p]=c*akp-s*akq; A[k][q]=s*akp+c*akq; }
      for(let k=0;k<n;k++){ const apk=A[p][k], aqk=A[q][k]; A[p][k]=c*apk-s*aqk; A[q][k]=s*apk+c*aqk; }
    }
  }
  const ev = A.map((r,i)=>r[i]).sort((a,b)=>a-b);
  return ev[1];
}
function twoHop(n, rounds){
  const adj = Array.from({length:n},()=>new Set());
  rounds.forEach(rd=>rd.forEach(([a,b])=>{ if(b>=0){ adj[a].add(b); adj[b].add(a); } }));
  let s=0; for(let v=0;v<n;v++){ const reach=new Set(adj[v]); adj[v].forEach(u=>adj[u].forEach(w=>reach.add(w))); reach.delete(v); s+=reach.size; }
  return s;
}
function makeSchedule(n){
  let best=null, bestScore=-1;
  for(let i=0;i<300;i++){
    const r = tryRounds(n); if(!r) continue;
    const sc = fiedler(n,r)*1000 + twoHop(n,r) + Math.random();
    if(sc>bestScore){ bestScore=sc; best=r; }
  }
  if(!best) return null;
  // shuffle table order inside each round, byes last
  return best.map(rd=>{ const real=shuffle(rd.filter(p=>p[1]>=0).map(p=>Math.random()<.5?p:[p[1],p[0]])); return real.concat(rd.filter(p=>p[1]<0)); });
}

/* ---------- qualifier scoring ---------- */
function matchOf(r,p){ const rd=S.rounds[r]; for(let m=0;m<rd.length;m++){ const [a,b]=rd[m]; if(a===p) return {m,opp:b,side:0}; if(b===p) return {m,opp:a,side:1}; } return null; }
function gamesOf(r,p){ // results from p's perspective
  const x = matchOf(r,p); if(!x) return null;
  if(x.opp<0) return {bye:true, g: BYE_AS_WINS?['W','W']:[null,null]};
  const g = S.res[r][x.m]; return {opp:x.opp, m:x.m, g: x.side? g.map(v=>v&&inv(v)) : g.slice()};
}
function computeQual(){
  const n=S.players.length; const rows=[];
  const wins=Array(n).fill(0);
  for(let p=0;p<n;p++) for(let r=0;r<ROUNDS;r++){ const x=gamesOf(r,p); x.g.forEach(v=>{ if(v==='W') wins[p]++; }); }
  let done=0, total=0;
  S.rounds.forEach((rd,r)=>rd.forEach(([a,b],m)=>{ if(b<0) return; total+=2; S.res[r][m].forEach(v=>{ if(v) done++; }); }));
  for(let p=0;p<n;p++){
    let main=wins[p]*WIN_PTS, sub=0; const cells=[];
    for(let r=0;r<ROUNDS;r++){ const x=gamesOf(r,p); cells.push(x); if(!x.bye) x.g.forEach(v=>{ if(v==='L'||v==='D') sub+=wins[x.opp]; }); }
    rows.push({p, wins:wins[p], main, sub, total:main+sub, cells});
  }
  const complete = done===total;
  // ranking
  const sorted = rows.slice().sort((a,b)=>b.total-a.total || a.p-b.p);
  const groups=[]; sorted.forEach(r=>{ const g=groups[groups.length-1]; if(g && g[0].total===r.total) g.push(r); else groups.push([r]); });
  let pos=1; const needTie=[]; let resolved=true; const ordered=[];
  groups.forEach(g=>{
    const start=pos, end=pos+g.length-1; pos+=g.length;
    if(g.length===1){ g[0].rank=start; ordered.push(g[0]); return; }
    const need = complete && (start===1 || (start<=4 && end>4));
    const key = g.map(r=>r.p).sort((a,b)=>a-b).join(',')+':'+g[0].total;
    if(need){
      const ord = S.tie[key]; const ok = ord && ord.length===g.length;
      needTie.push({key, members:g.map(r=>r.p), total:g[0].total, start, order: ord||[]});
      if(ok){ ord.forEach((p,i)=>{ const r=g.find(x=>x.p===p); r.rank=start+i; ordered.push(r); }); return; }
      resolved=false;
    }
    g.forEach(r=>{ r.rank=start; ordered.push(r); });
  });
  const final = complete && resolved;
  if(final) ordered.forEach((r,i)=>{ r.adv = i<4; });
  return {rows, ordered, complete, final, needTie, done, total};
}

/* ---------- finals ---------- */
function bo3(g){ const a=g.filter(v=>v==='W').length, b=g.filter(v=>v==='L').length; return a>=2?0 : b>=2?1 : -1; }
function semiPairs(){
  if(!S.semiLocked) return null;
  const t=S.top4; const opp=S.semiOpp; const rest=t.filter((p,i)=>i>0 && p!==opp);
  return [[t[0],opp],[rest[0],rest[1]]];
}
function finState(){
  const sp = semiPairs(); if(!sp) return null;
  const sw = S.fin.semi.map(bo3);
  let champ=null, third=null;
  if(sw[0]>=0 && sw[1]>=0){
    champ=[sp[0][sw[0]], sp[1][sw[1]]]; third=[sp[0][1-sw[0]], sp[1][1-sw[1]]];
  }
  const sync=(slot,pair)=>{ const f=S.fin[slot]; if(!pair){ return {pair:null,g:[]}; } if(!f.pair||f.pair[0]!==pair[0]||f.pair[1]!==pair[1]) return {pair,g:[]}; return f; };
  const C=sync('champ',champ), T=sync('third',third);
  return {sp, sw, champ:C, third:T, cw: C.pair?bo3(C.g):-1, tw: T.pair?bo3(T.g):-1};
}

/* ---------- backup milestones ---------- */
function roundDone(r){ return S.res && S.rounds[r].every(([a,b],m)=> b<0 || S.res[r][m].every(v=>v)); }
function milestones(){
  const m=[]; if(!S.schedLocked) return m;
  m.push('sched');
  for(let r=0;r<ROUNDS;r++) if(roundDone(r)) m.push('r'+r);
  if(S.top4) m.push('top4');
  const F=finState();
  if(F){ if(F.sw[0]>=0&&F.sw[1]>=0) m.push('semi'); if(F.cw>=0&&F.tw>=0) m.push('final'); }
  return m;
}
const backupDue = () => milestones().some(x=>!backed.includes(x));

/* ---------- render ---------- */
let page='sched';
function render(){
  const players = S.schedLocked ? S.players : parseRoster(S.roster);
  // tabs
  document.querySelectorAll('.tab').forEach(t=>{
    const pg=t.dataset.page;
    t.disabled = (pg==='qual' && !S.schedLocked) || (pg==='final' && !S.top4);
    t.classList.toggle('active', pg===page);
  });
  if(document.querySelector(`.tab[data-page="${page}"]`).disabled) page='sched';
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+page));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===page));
  $('#undoBtn').disabled = !undo.length;
  $('#exportBtn').classList.toggle('due', backupDue());
  $('#saved').textContent = S.savedAt ? '已自動儲存 '+new Date(S.savedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';

  // schedule
  const ta=$('#roster');
  if(document.activeElement!==ta) ta.value=S.roster;
  ta.readOnly=S.schedLocked;
  $('#cnt').textContent = players.length+' 人';
  $('#loadTxt').disabled=S.schedLocked;
  $('#genBtn').disabled=S.schedLocked;
  $('#lockBtn').disabled=S.schedLocked || !S.rounds;
  $('#lockBtn').hidden=S.schedLocked;
  $('#genBtn').hidden=S.schedLocked;
  $('#lockBadge').hidden=!S.schedLocked;
  renderSched();
  if(S.schedLocked) renderQual();
  if(S.top4) renderFinal();
}
function renderSched(){
  const v=$('#schedView');
  if(!S.rounds){ v.innerHTML='<div style="padding:60px 0;text-align:center;color:#a9b8c7;font-size:20px">—</div>'; return; }
  const tables=Math.max(...S.rounds.map(rd=>rd.filter(p=>p[1]>=0).length));
  const hasBye=S.rounds.some(rd=>rd.some(p=>p[1]<0));
  let h='<div class="tw"><table class="sched"><tr><th></th>'+S.rounds.map((_,r)=>`<th>第${r+1}輪</th>`).join('')+'</tr>';
  for(let t=0;t<tables;t++){
    h+=`<tr><td class="tno">第${t+1}桌</td>`+S.rounds.map(rd=>{ const p=rd.filter(x=>x[1]>=0)[t]; return p?`<td><span class="p">${nm(p[0])}</span><span class="vs">vs</span><span class="p">${nm(p[1])}</span></td>`:'<td></td>'; }).join('')+'</tr>';
  }
  if(hasBye) h+='<tr><td class="tno">輪空</td>'+S.rounds.map(rd=>{ const p=rd.find(x=>x[1]<0); return `<td class="bye p">${p?nm(p[0]):''}</td>`; }).join('')+'</tr>';
  v.innerHTML=h+'</table></div>';
}
function markHTML(g){ return '<div class="mk">'+g.map(v=>`<span class="${v||'N'}">${v?MARK[v]:'·'}</span>`).join('')+'</div>'; }
function renderQual(){
  const Q=computeQual(); const locked=!!S.top4;
  $('#qProg').textContent = locked ? '🔒 四強已鎖定' : `${Q.done} / ${Q.total} 場`;
  const rows = Q.final ? Q.ordered : Q.rows;
  let h='<tr><th style="text-align:left;padding-left:14px">選手</th>'+[...Array(ROUNDS)].map((_,r)=>`<th>第${r+1}輪${roundDone(r)?'<span class="ok">✓</span>':''}</th>`).join('')+'<th>勝場</th><th>主分</th><th>輔分</th><th>總分</th><th>名次</th><th>晉級</th></tr>';
  rows.forEach(R=>{
    h+=`<tr class="${Q.final&&R.adv?'adv':''}"><td class="name">${nm(R.p)}</td>`;
    R.cells.forEach((c,r)=>{
      if(c.bye) h+=`<td class="rc locked"><div class="byecell">輪空</div><div class="opp">${BYE_AS_WINS?'○○':''}</div></td>`;
      else h+=`<td class="rc${locked?' locked':''}" data-r="${r}" data-p="${R.p}">${markHTML(c.g)}<div class="opp">${nm(c.opp)}</div></td>`;
    });
    h+=`<td class="num">${R.wins}</td><td class="num">${R.main}</td><td class="num">${R.sub}</td><td class="total">${R.total}</td>`;
    h+=`<td class="rank">${Q.final?R.rank:''}</td><td>${Q.final&&R.adv?'<span class="adv-tag">晉級</span>':''}</td></tr>`;
  });
  $('#qTable').innerHTML=h;
  // ties
  const tb=$('#tieBox');
  if(Q.complete && Q.needTie.length && !locked){
    tb.hidden=false;
    tb.innerHTML='<h2>同分加賽</h2>'+Q.needTie.map(t=>{
      const chips=t.members.map(p=>{ const i=t.order.indexOf(p); return `<button class="chip${i>=0?' on':''}" data-tie="${t.key}" data-p="${p}">${i>=0?`<span class="ord">${t.start+i}</span>`:''}${nm(p)}</button>`; }).join('');
      return `<div class="grp"><span class="pts">${t.total} 分</span>${chips}<button class="btn ghost" style="padding:8px 16px;font-size:16px" data-tieclr="${t.key}">重選</button></div>`;
    }).join('');
  } else tb.hidden=true;
  const b=$('#top4Btn'); b.hidden = locked || !Q.final;
}
const colsFor = g => Math.max(3, g.length + (bo3(g)<0?1:0));
function gameRow(label, pair, g, slot, sub, cols){
  const dec=bo3(g); cols = cols || colsFor(g);
  const tag=(side)=>{
    if(dec<0) return '';
    const win = dec===side;
    if(slot==='semi') return win?'<span class="restag">晉級</span>':'';
    if(slot==='champ') return win?'<span class="restag c1">冠軍</span>':'<span class="restag c2">亞軍</span>';
    return win?'<span class="restag c3">季軍</span>':'<span class="restag c4">殿軍</span>';
  };
  let h='';
  [0,1].forEach(side=>{
    h+='<tr>';
    if(side===0) h+=`<td class="grp" rowspan="2">${label}</td>`;
    h+=`<td class="name">${pair&&pair[side]!=null?nm(pair[side]):'<span class="tbd">待定</span>'}</td>`;
    for(let i=0;i<cols;i++){
      const v=g[i]; const pv = v ? (side? inv(v):v) : null;
      const open = pair && (i<g.length || (i===g.length && dec<0));
      h+=`<td class="g ${pv||''} ${open?'':'off'} ${open&&i===g.length?'next':''}" ${open?`data-slot="${slot}" data-sub="${sub}" data-i="${i}" data-side="${side}"`:''}>${pv?MARK[pv]:''}</td>`;
    }
    h+=`<td class="res">${pair?tag(side):''}</td></tr>`;
  });
  return {h, cols};
}
function finTable(title, blocks){
  const cols=Math.max(...blocks.map(b=>b.cols));
  return `<div class="sec-title">${title}</div><div class="tw"><table class="ft"><tr><th></th><th style="text-align:left;padding-left:14px">選手</th>${[...Array(cols)].map((_,i)=>`<th>第${i+1}戰</th>`).join('')}<th>結果</th></tr>${blocks.map(b=>b.h).join('')}</table></div>`;
}
function renderFinal(){
  const v=$('#finalView'); const t=S.top4; let h='';
  if(!S.semiLocked){
    h+=`<div class="card nocap" style="max-width:880px"><h2>四強對戰</h2><div class="seedsel"><span class="me">第1名 ${nm(t[0])}</span><span class="vs" style="color:#9fb3c8">vs</span>`+
      t.slice(1).map((p,i)=>`<button class="chip${S.semiOpp===p?' on':''}" data-opp="${p}">第${i+2}名 ${nm(p)}</button>`).join('')+
      `</div><div class="btns"><button class="btn gold" id="semiLock" ${S.semiOpp==null?'disabled':''}>🔒 確認對戰</button></div></div>`;
  }
  const F=finState();
  const sp = F ? F.sp : [[t[0],null],[null,null]];
  const sc=Math.max(colsFor(S.fin.semi[0]), colsFor(S.fin.semi[1]));
  const g0=gameRow('第一組', F?sp[0]:null, S.fin.semi[0], 'semi', 0, sc);
  const g1=gameRow('第二組', F?sp[1]:null, S.fin.semi[1], 'semi', 1, sc);
  h+=finTable('四強賽',[g0,g1]);
  const c=gameRow('冠軍賽', F&&F.champ.pair, F?F.champ.g:[], 'champ', 0);
  const d=gameRow('季軍賽', F&&F.third.pair, F?F.third.g:[], 'third', 0);
  h+=finTable('冠軍賽',[c]); h+=finTable('季軍賽',[d]);
  if(F && F.cw>=0 && F.tw>=0){
    const cp=F.champ.pair, tp=F.third.pair;
    const pl=[cp[F.cw],cp[1-F.cw],tp[F.tw],tp[1-F.tw]];
    h+='<div class="podium">'+['🏆 冠軍','🥈 亞軍','🥉 季軍','殿軍'].map((l,i)=>`<div class="pod p${i+1}"><div class="t">${l}</div><div class="n">${nm(pl[i])}</div></div>`).join('')+'</div>';
  }
  v.innerHTML=h;
}

/* ---------- popups ---------- */
function popup(html){ const w=document.createElement('div'); w.className='pop-wrap'; w.innerHTML=`<div class="pop">${html}</div>`; w.addEventListener('click',e=>{ if(e.target===w) w.remove(); }); document.body.appendChild(w); return w; }
function editQual(r,p){
  const x=matchOf(r,p); const [a,b]=S.rounds[r][x.m]; const cur=S.res[r][x.m].slice();
  const A=nm(a), B=nm(b);
  const w=popup(`<div class="hd"><div class="r">第${r+1}輪</div><div class="m">${A}<span class="vs">vs</span>${B}</div></div>
    <div class="bd">${[0,1].map(i=>`<div class="gline"><span class="gl">第${i+1}場</span>
      <button class="opt a" data-i="${i}" data-v="W">${A} 勝</button><button class="opt d" data-i="${i}" data-v="D">和局</button><button class="opt b" data-i="${i}" data-v="L">${B} 勝</button></div>`).join('')}</div>
    <div class="ft2"><button data-act="clr" style="background:#eef2f6;color:#5d6e80">清除</button><button data-act="no" style="background:#ccc">取消</button><button data-act="ok" style="background:#2f74c0;color:#fff">儲存</button></div>`);
  const paint=()=>w.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on', cur[+o.dataset.i]===o.dataset.v));
  paint();
  w.addEventListener('click',e=>{
    const o=e.target.closest('.opt'); if(o){ const i=+o.dataset.i; cur[i]= cur[i]===o.dataset.v?null:o.dataset.v; paint(); return; }
    const act=e.target.dataset.act; if(!act) return;
    if(act==='clr'){ cur[0]=cur[1]=null; paint(); return; }
    if(act==='ok') commit(()=>{ S.res[r][x.m]=cur; });
    w.remove();
  });
}
function editFinal(slot, sub, i){
  const F=finState(); let pair, g;
  if(slot==='semi'){ pair=F.sp[sub]; g=S.fin.semi[sub]; } else { pair=F[slot].pair; g=F[slot].g; }
  const A=nm(pair[0]), B=nm(pair[1]);
  const label={semi:`四強賽 第${sub?'二':'一'}組`,champ:'冠軍賽',third:'季軍賽'}[slot];
  const w=popup(`<div class="hd"><div class="r">${label} · 第${i+1}戰</div><div class="m">${A}<span class="vs">vs</span>${B}</div></div>
    <div class="bd"><div class="gline"><button class="opt a" data-v="W">${A} 勝</button><button class="opt d" data-v="D">和局</button><button class="opt b" data-v="L">${B} 勝</button></div></div>
    <div class="ft2">${i<g.length?'<button data-act="clr" style="background:#eef2f6;color:#5d6e80">清除</button>':''}<button data-act="no" style="background:#ccc">取消</button></div>`);
  w.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on', g[i]===o.dataset.v));
  w.addEventListener('click',e=>{
    const o=e.target.closest('.opt');
    const setG = ng => commit(()=>{
      if(slot==='semi'){ S.fin.semi[sub]=ng; }
      else S.fin[slot]={pair:pair.slice(), g:ng};
      // keep downstream slots consistent
      const f=finState(); S.fin.champ=f.champ; S.fin.third=f.third;
    });
    if(o){
      let ng=g.slice(); ng[i]=o.dataset.v;
      // drop games played past a decided result
      let k=0; for(;k<ng.length;k++){ if(bo3(ng.slice(0,k+1))>=0) break; } ng=ng.slice(0,k+1);
      setG(ng); w.remove(); return;
    }
    const act=e.target.dataset.act; if(!act) return;
    if(act==='clr') setG(g.slice(0,i));
    w.remove();
  });
}

/* ---------- PNG ---------- */
async function shot(pg){
  if(typeof html2canvas!=='function'){ showModal('無法下載','截圖元件未載入','error'); return; }
  const el=$('#page-'+pg);
  const time=new Date().toLocaleString('zh-TW',{hour12:false});
  document.querySelectorAll('.capTime').forEach(x=>x.textContent=time);
  const wasActive=el.classList.contains('active');
  el.classList.add('active','capturing');
  const w=Math.max(720, ...[...el.querySelectorAll('table')].filter(t=>t.offsetParent).map(t=>t.scrollWidth+48));
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',windowWidth:Math.max(w+60,1100),width:w,
      onclone:(doc)=>{ const c=doc.getElementById('page-'+pg); c.style.width=w+'px'; c.style.padding='24px'; }});
    canvas.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`2026春季盃_${{sched:'對戰表',qual:'積分賽',final:'決賽'}[pg]}_${stamp()}.png`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); },'image/png');
  }catch(e){ showModal('下載失敗', esc(e.message||e), 'error'); }
  finally{ el.classList.remove('capturing'); if(!wasActive) el.classList.remove('active'); }
}

/* ---------- events ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ if(t.disabled) return; page=t.dataset.page; render(); window.scrollTo(0,0); });
$('#roster').addEventListener('input',e=>{ S.roster=e.target.value; $('#cnt').textContent=parseRoster(S.roster).length+' 人'; save(); });
$('#roster').addEventListener('blur',()=>render());
$('#loadTxt').onclick=()=>loadTxt(false);
$('#genBtn').onclick=()=>{
  const names=parseRoster(S.roster);
  const dup=names.filter((n,i)=>names.indexOf(n)!==i);
  if(names.length<6) return showModal('人數不足','至少需要 6 名選手','error');
  if(dup.length) return showModal('名單重複', [...new Set(dup)].map(esc).join('、'), 'error');
  ask(S.rounds?'重新排定對戰':'排定對戰', `以 <b>${names.length}</b> 名選手隨機排定五輪對戰${S.rounds?'<br>目前的對戰組合將被取代':''}`, ()=>{
    const r=makeSchedule(names.length);
    if(!r) return showModal('排定失敗','請再試一次','error');
    commit(()=>{ S.players=names; S.rounds=r; });
  }, '排定');
};
$('#lockBtn').onclick=()=>{
  const names=parseRoster(S.roster);
  if(names.length!==S.players.length || names.some((n,i)=>n!==S.players[i])) return showModal('名單已變更','名單與對戰組合不符，請重新排定','error');
  ask('鎖定賽程','鎖定後無法再修改名單與對戰組合', ()=>commit(()=>{
    S.schedLocked=true; S.res=S.rounds.map(rd=>rd.map(()=>[null,null]));
  }), '鎖定');
};
$('#qTable').addEventListener('click',e=>{
  const c=e.target.closest('td.rc[data-r]'); if(!c) return;
  if(S.top4) return showModal('四強已鎖定','如需修改請先「復原」','error');
  editQual(+c.dataset.r, +c.dataset.p);
});
$('#tieBox').addEventListener('click',e=>{
  const clr=e.target.closest('[data-tieclr]');
  if(clr) return commit(()=>{ delete S.tie[clr.dataset.tieclr]; });
  const ch=e.target.closest('.chip[data-tie]'); if(!ch) return;
  const key=ch.dataset.tie, p=+ch.dataset.p; const ord=(S.tie[key]||[]).slice();
  if(ord.includes(p)) return;
  ord.push(p);
  const size=key.split(':')[0].split(',').length;
  if(ord.length===size-1){ const last=key.split(':')[0].split(',').map(Number).find(x=>!ord.includes(x)); ord.push(last); }
  commit(()=>{ S.tie[key]=ord; });
});
$('#top4Btn').onclick=()=>{
  const Q=computeQual(); if(!Q.final) return;
  const t=Q.ordered.slice(0,4).map(r=>r.p);
  ask('鎖定四強', t.map((p,i)=>`第${i+1}名　<b>${nm(p)}</b>`).join('<br>'), ()=>{ commit(()=>{ S.top4=t; }); page='final'; render(); }, '鎖定');
};
$('#finalView').addEventListener('click',e=>{
  const o=e.target.closest('[data-opp]');
  if(o){ return commit(()=>{ S.semiOpp=+o.dataset.opp; }); }
  if(e.target.id==='semiLock'){
    const t=S.top4, opp=S.semiOpp, rest=t.filter((p,i)=>i>0&&p!==opp);
    return ask('確認四強對戰', `第一組　<b>${nm(t[0])}</b> vs <b>${nm(opp)}</b><br>第二組　<b>${nm(rest[0])}</b> vs <b>${nm(rest[1])}</b>`, ()=>commit(()=>{ S.semiLocked=true; }), '鎖定');
  }
  const g=e.target.closest('td.g[data-slot]'); if(!g) return;
  editFinal(g.dataset.slot, +g.dataset.sub, +g.dataset.i);
});
document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>shot(b.dataset.shot));
$('#undoBtn').onclick=()=>{ if(!undo.length) return; S=JSON.parse(undo.pop()); save(); render(); };
$('#exportBtn').onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`2026春季盃_備份_${stamp()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  backed=milestones(); saveBacked(); render();
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(!d||d.v!==1||!('roster' in d)) throw 0;
    ask('還原備份', `以 <b>${esc(f.name)}</b> 取代目前所有資料？`, ()=>{ commit(()=>{ S=d; }); backed=milestones(); saveBacked(); page='sched'; render(); }, '還原');
  }catch(err){ showModal('還原失敗','不是有效的備份檔','error'); }
};
$('#resetBtn').onclick=()=>ask('重設全部資料','名單、賽程與所有成績將被清除', ()=>{ commit(()=>{ const r=S.roster; S=blank(); S.roster=r; }); backed=[]; saveBacked(); page='sched'; render(); }, '重設');
window.addEventListener('storage',e=>{ if(e.key===KEY+'-backed'){ try{ backed=JSON.parse(e.newValue)||[]; }catch(x){} render(); } if(e.key===KEY){ const s=load(); if(s){ S=s; render(); } } });

render();
if(!S.roster.trim() && !S.schedLocked) loadTxt(true);
</script>
</body>
